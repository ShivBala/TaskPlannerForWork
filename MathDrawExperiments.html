<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Master Studio</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #ccc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 360px;
            background: #111;
            border-right: 1px solid #222;
            padding: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 30px rgba(0,0,0,0.9);
            z-index: 10;
        }

        .scroll-area {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-track { background: #111; }
        .scroll-area::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        h2 { color: #fff; margin: 0 0 5px 0; font-size: 18px; letter-spacing: 1px; }
        .subtitle { color: #d4af37; font-size: 11px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        h3 { color: #666; font-size: 11px; margin: 15px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-bottom: 1px solid #222; padding-bottom: 4px;}

        .control-group {
            background: #161616;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
            margin-bottom: 8px;
        }

        label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;}
        span.val { color: #d4af37; font-family: monospace; font-size: 12px;}
        
        input[type=range] {
            width: 100%;
            accent-color: #d4af37;
            background: #333;
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        select {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        select:focus { border-color: #d4af37; }

        /* --- SECTOR GRID (The New Border Control) --- */
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 5px;
        }
        .sector-btn {
            background: #222;
            border: 1px solid #333;
            color: #555;
            padding: 8px 0;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
        }
        .sector-btn.active {
            background: #d4af37;
            color: #000;
            font-weight: bold;
            border-color: #d4af37;
        }
        .sector-center {
            background: transparent;
            border: none;
            color: #444;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.main-action {
            margin: 20px;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #8c702a 100%);
            border: none;
            color: white;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        button.main-action:hover { filter: brightness(1.15); }
        button.main-action:disabled { background: #333; color: #555; cursor: wait; }

        /* --- CANVAS AREA --- */
        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            background-image: 
                linear-gradient(45deg, #111 25%, transparent 25%), 
                linear-gradient(-45deg, #111 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111 75%), 
                linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px;
            position: relative;
            padding: 40px;
            overflow: auto;
        }
        
        canvas {
            box-shadow: 0 0 50px #000;
            border: 1px solid #333;
            max-width: 90%;
            max-height: 90%;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            color: #d4af37;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            border: 4px solid #222;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text { font-size: 20px; font-weight: bold; }
        .loading-detail { font-size: 14px; color: #666; margin-top: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="scroll-area">
            <h2>Golden Studio</h2>
            <div class="subtitle">Master Edition</div>

            <h3>1. Material & Finish</h3>
            <div class="control-group">
                <label>Material</label>
                <select id="material">
                    <option value="gold">Pure Gold</option>
                    <option value="rose">Rose Gold</option>
                    <option value="silver">Silver</option>
                    <option value="platinum">Platinum</option>
                    <option value="obsidian">Obsidian</option>
                    <option value="porcelain">Porcelain</option>
                </select>
            </div>
            <div class="control-group">
                <label>Dithering (Noise) <span class="val" id="val-dither">15</span></label>
                <input type="range" id="dither" min="0" max="50" step="1" value="15">
            </div>

            <h3>2. Render Mode</h3>
            <div class="control-group">
                <select id="mode">
                    <option value="single">Single Object (Center)</option>
                    <option value="border">Border Frame</option>
                </select>
            </div>

            <div id="border-sector-ui" style="display:none;">
                <h3>Border Sectors</h3>
                <div class="control-group">
                    <div style="font-size:10px; color:#666; margin-bottom:5px; text-align:center;">Click segments to toggle drawing</div>
                    <div class="sector-grid">
                        <div class="sector-btn active" data-sec="TL">Corner</div>
                        <div class="sector-btn active" data-sec="T">Top</div>
                        <div class="sector-btn active" data-sec="TR">Corner</div>
                        
                        <div class="sector-btn active" data-sec="L">Left</div>
                        <div class="sector-center">+</div>
                        <div class="sector-btn active" data-sec="R">Right</div>

                        <div class="sector-btn active" data-sec="BL">Corner</div>
                        <div class="sector-btn active" data-sec="B">Bottom</div>
                        <div class="sector-btn active" data-sec="BR">Corner</div>
                    </div>
                </div>
                <div class="control-group">
                    <label>Border Spacing <span class="val" id="val-spacing">70</span></label>
                    <input type="range" id="spacing" min="30" max="150" step="5" value="70">
                </div>
                 <div class="control-group">
                    <label>Inset Margin <span class="val" id="val-margin">80</span></label>
                    <input type="range" id="margin" min="0" max="250" step="10" value="80">
                </div>
            </div>

            <h3>3. Geometry (Shape)</h3>
            <div class="control-group">
                <label>Petals (Around) <span class="val" id="val-k1">6</span></label>
                <input type="range" id="k1" min="2" max="16" step="1" value="6">
            </div>
            <div class="control-group">
                <label>Petals (Vertical) <span class="val" id="val-k2">5</span></label>
                <input type="range" id="k2" min="1" max="16" step="1" value="5">
            </div>
            <div class="control-group">
                <label>Twist/Spiral <span class="val" id="val-twist">0.5</span></label>
                <input type="range" id="twist" min="-4" max="4" step="0.1" value="0.5">
            </div>
            <div class="control-group">
                <label>Depth/Bump <span class="val" id="val-amp">0.35</span></label>
                <input type="range" id="amp" min="0" max="1.0" step="0.05" value="0.35">
            </div>
            <div class="control-group">
                <label>Sharpness <span class="val" id="val-sharp">2.0</span></label>
                <input type="range" id="sharp" min="0.5" max="5.0" step="0.1" value="2.0">
            </div>

            <h3>4. Transform</h3>
            <div class="control-group">
                <label>Size <span class="val" id="val-scale">45</span></label>
                <input type="range" id="scale" min="10" max="200" step="1" value="45">
            </div>
            <div class="control-group">
                <label>Rotation X/Y/Z</label>
                <div style="display:flex; gap:5px;">
                    <input type="range" id="rotX" min="0" max="360" step="5" value="45">
                    <input type="range" id="rotY" min="0" max="360" step="5" value="45">
                    <input type="range" id="rotZ" min="0" max="360" step="5" value="0">
                </div>
            </div>
            
            <h3>5. Export Settings</h3>
            <div class="control-group">
                <label>Resolution</label>
                <select id="exportRes">
                    <option value="1024">HD (1024 px)</option>
                    <option value="2048">2K (2048 px)</option>
                    <option value="4096" selected>4K (4096 px)</option>
                    <option value="8192">8K (8192 px)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Aspect Ratio</label>
                <select id="canvasShape">
                    <option value="square">Square (1:1)</option>
                    <option value="portrait">Portrait (4:5)</option>
                    <option value="landscape">Landscape (3:2)</option>
                </select>
            </div>
        </div>
        <button id="btn-export" class="main-action">Render & Download</button>
    </div>

    <div class="canvas-container">
        <canvas id="previewCanvas"></canvas>
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Rendering Master Image</div>
            <div class="loading-detail" id="loading-msg">Please wait...</div>
        </div>
    </div>

<script>
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const loadingOverlay = document.getElementById('loading');
    const loadingMsg = document.getElementById('loading-msg');

    // --- PALETTES ---
    const PALETTES = {
        gold: [ { pos: 0.0, color: [40, 25, 5] }, { pos: 0.4, color: [184, 134, 11] }, { pos: 0.7, color: [255, 215, 0] }, { pos: 0.95, color: [255, 250, 220] }, { pos: 1.0, color: [255, 255, 255] } ],
        rose: [ { pos: 0.0, color: [50, 20, 20] }, { pos: 0.4, color: [184, 100, 100] }, { pos: 0.7, color: [255, 180, 160] }, { pos: 0.95, color: [255, 235, 230] }, { pos: 1.0, color: [255, 255, 255] } ],
        silver: [ { pos: 0.0, color: [25, 25, 30] }, { pos: 0.4, color: [120, 120, 120] }, { pos: 0.7, color: [210, 210, 210] }, { pos: 0.95, color: [245, 245, 250] }, { pos: 1.0, color: [255, 255, 255] } ],
        platinum: [ { pos: 0.0, color: [20, 25, 35] }, { pos: 0.4, color: [90, 100, 115] }, { pos: 0.7, color: [160, 180, 200] }, { pos: 0.95, color: [230, 245, 255] }, { pos: 1.0, color: [255, 255, 255] } ],
        porcelain: [ { pos: 0.0, color: [140, 140, 145] }, { pos: 0.5, color: [235, 235, 235] }, { pos: 0.8, color: [255, 255, 255] }, { pos: 0.95, color: [255, 255, 255] }, { pos: 1.0, color: [255, 255, 255] } ],
        obsidian: [ { pos: 0.0, color: [0, 0, 0] }, { pos: 0.5, color: [20, 20, 20] }, { pos: 0.8, color: [50, 50, 50] }, { pos: 0.98, color: [220, 220, 220] }, { pos: 1.0, color: [255, 255, 255] } ]
    };

    const LIGHT_DIR = {x: 0.6, y: -0.8, z: -1.0};
    const LIGHT_MAG = Math.sqrt(LIGHT_DIR.x**2 + LIGHT_DIR.y**2 + LIGHT_DIR.z**2);

    // --- PARAMETERS ---
    const params = {
        material: 'gold', mode: 'single', canvasShape: 'square',
        dither: 15,
        k1: 6, k2: 5, twist: 0.5, amp: 0.35, sharp: 2.0,
        scale: 45,
        rotX: 45 * (Math.PI/180), rotY: 45 * (Math.PI/180), rotZ: 0,
        spacing: 70, margin: 80,
        // Sector States
        sectors: { TL:true, T:true, TR:true, L:true, R:true, BL:true, B:true, BR:true }
    };

    // --- UI HANDLERS ---
    const inputs = document.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('input', (e) => {
            const id = e.target.id;
            let val = e.target.value;
            if(input.type === 'range') val = parseFloat(val);
            
            if (id.startsWith('rot')) params[id] = val * (Math.PI / 180);
            else if (id !== 'exportRes') params[id] = val;

            const labelSpan = document.getElementById(`val-${id}`);
            if(labelSpan) labelSpan.innerText = e.target.value;

            if (id === 'mode') document.getElementById('border-sector-ui').style.display = (val === 'border') ? 'block' : 'none';
            
            requestAnimationFrame(renderPreview);
        });
    });

    // SECTOR BUTTON LOGIC
    document.querySelectorAll('.sector-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const sec = btn.dataset.sec;
            params.sectors[sec] = !params.sectors[sec]; // Toggle
            if(params.sectors[sec]) btn.classList.add('active');
            else btn.classList.remove('active');
            requestAnimationFrame(renderPreview);
        });
    });

    // --- MATH ---
    function lerpColor(a, b, t) { return Math.floor(a + (b - a) * t); }

    function getMaterialColor(intensity, matName) {
        let t;
        if(matName === 'porcelain') t = Math.pow(intensity, 2.5);
        else if (matName === 'obsidian') t = Math.pow(intensity, 5.0);
        else t = Math.pow(intensity, 0.65);

        if (params.dither > 0) {
             const noise = (Math.random() - 0.5) * (params.dither / 300); 
             t += noise;
             t = Math.max(0, Math.min(1, t));
        }

        const stops = PALETTES[matName];
        let c1, c2, localT;
        for (let i = 0; i < stops.length - 1; i++) {
            if (t >= stops[i].pos && t <= stops[i+1].pos) {
                c1 = stops[i]; c2 = stops[i+1];
                localT = (t - c1.pos) / (c2.pos - c1.pos);
                break;
            }
        }
        if(!c1) { c1 = stops[stops.length-1]; c2 = stops[stops.length-1]; localT = 0;}
        return `rgb(${lerpColor(c1.color[0], c2.color[0], localT)},${lerpColor(c1.color[1], c2.color[1], localT)},${lerpColor(c1.color[2], c2.color[2], localT)})`;
    }

    function getRadius(theta, phi) {
        let effectiveTheta = theta + params.twist * phi;
        let baseShape = Math.sin(params.k1 * effectiveTheta) * Math.cos(params.k2 * phi);
        let shape = Math.pow(Math.abs(baseShape), params.sharp); 
        let dampener = Math.pow(Math.sin(phi), 1.5); 
        return 1.0 + params.amp * shape * dampener;
    }

    function rotatePoint(p) {
        let x = p.x, y = p.y, z = p.z;
        let rx = x * Math.cos(params.rotY) - z * Math.sin(params.rotY);
        let rz = x * Math.sin(params.rotY) + z * Math.cos(params.rotY);
        x = rx; z = rz;
        let ry = y * Math.cos(params.rotX) - z * Math.sin(params.rotX);
        rz = y * Math.sin(params.rotX) + z * Math.cos(params.rotX);
        y = ry; z = rz;
        rx = x * Math.cos(params.rotZ) - y * Math.sin(params.rotZ);
        ry = x * Math.sin(params.rotZ) + y * Math.cos(params.rotZ);
        x = rx; y = ry;
        return {x, y, z};
    }

    // --- DRAWING ---
    function drawObject(context, posX, posY, resolutionSteps, objectScale) {
        const latSteps = resolutionSteps[0];
        const lonSteps = resolutionSteps[1];
        let vertices = [];

        for (let i = 0; i <= latSteps; i++) {
            let phi = Math.PI * i / latSteps;
            for (let j = 0; j <= lonSteps; j++) {
                let theta = 2 * Math.PI * j / lonSteps;
                let r = getRadius(theta, phi);
                let x = r * Math.sin(phi) * Math.cos(theta);
                let y = r * Math.cos(phi);
                let z = r * Math.sin(phi) * Math.sin(theta);
                vertices.push(rotatePoint({x,y,z}));
            }
        }

        const perspective = 1000;
        context.lineJoin = 'round';
        context.lineCap = 'round';
        context.lineWidth = Math.max(0.5, objectScale / 100); 

        for (let i = 0; i < latSteps; i++) {
            for (let j = 0; j < lonSteps; j++) {
                let p1Idx = i * (lonSteps + 1) + j;
                let p2Idx = p1Idx + 1;
                let p3Idx = (i + 1) * (lonSteps + 1) + j + 1;
                let p4Idx = p3Idx - 1;

                let v1 = vertices[p1Idx];
                if (v1.z > 0.6) continue; 

                let v2 = vertices[p2Idx];
                let v4 = vertices[p4Idx];
                
                let ax = v2.x - v1.x, ay = v2.y - v1.y, az = v2.z - v1.z;
                let bx = v4.x - v1.x, by = v4.y - v1.y, bz = v4.z - v1.z;
                let nx = ay * bz - az * by;
                let ny = az * bx - ax * bz;
                let nz = ax * by - ay * bx;
                let dot = nx*LIGHT_DIR.x + ny*LIGHT_DIR.y + nz*LIGHT_DIR.z;
                let normMag = Math.sqrt(nx*nx + ny*ny + nz*nz);
                let intensity = Math.abs(dot / (normMag * LIGHT_MAG));
                
                let color = getMaterialColor(intensity, params.material);
                
                const proj = (v) => {
                    const s = perspective / (perspective + v.z + objectScale*3);
                    return { x: posX + v.x * objectScale * s, y: posY + v.y * objectScale * s };
                }

                let pp1 = proj(v1); let pp2 = proj(v2);
                let pp3 = proj(vertices[p3Idx]); let pp4 = proj(vertices[p4Idx]);

                context.fillStyle = color;
                context.strokeStyle = color;
                context.beginPath();
                context.moveTo(pp1.x, pp1.y);
                context.lineTo(pp2.x, pp2.y);
                context.lineTo(pp3.x, pp3.y);
                context.lineTo(pp4.x, pp4.y);
                context.closePath();
                context.fill();
                context.stroke();
            }
        }
    }

    function renderScene(targetCtx, w, h, isPreview) {
        targetCtx.clearRect(0, 0, w, h);

        const resolutionFactor = w / 1000;
        let polyLat = isPreview ? 35 : Math.min(400, 80 * resolutionFactor);
        let polyLon = isPreview ? 45 : Math.min(500, 100 * resolutionFactor);
        const res = [polyLat, polyLon];

        // SINGLE MODE
        if (params.mode === 'single') {
            let baseScale = params.scale * resolutionFactor * 4;
            drawObject(targetCtx, w/2, h/2, res, baseScale);
            return;
        }

        // BORDER MODE
        const margin = params.margin * resolutionFactor;
        const spacing = params.spacing * resolutionFactor;
        const baseScale = params.scale * resolutionFactor;
        const s = params.sectors;

        // Logic: Fill specific sectors with objects
        
        // Top Row
        const innerW = w - margin*2;
        const innerH = h - margin*2;
        const topCount = Math.floor(innerW / spacing);
        const sideCount = Math.floor(innerH / spacing);

        // Corners
        if(s.TL) drawObject(targetCtx, margin, margin, res, baseScale);
        if(s.TR) drawObject(targetCtx, w - margin, margin, res, baseScale);
        if(s.BL) drawObject(targetCtx, margin, h - margin, res, baseScale);
        if(s.BR) drawObject(targetCtx, w - margin, h - margin, res, baseScale);

        // Top Side
        if(s.T) {
            for(let i=1; i<topCount; i++) {
                let px = margin + (i/topCount)*innerW;
                drawObject(targetCtx, px, margin, res, baseScale);
            }
        }

        // Bottom Side
        if(s.B) {
            for(let i=1; i<topCount; i++) {
                let px = margin + (i/topCount)*innerW;
                drawObject(targetCtx, px, h-margin, res, baseScale);
            }
        }

        // Left Side
        if(s.L) {
            for(let i=1; i<sideCount; i++) {
                let py = margin + (i/sideCount)*innerH;
                drawObject(targetCtx, margin, py, res, baseScale);
            }
        }

        // Right Side
        if(s.R) {
            for(let i=1; i<sideCount; i++) {
                let py = margin + (i/sideCount)*innerH;
                drawObject(targetCtx, w-margin, py, res, baseScale);
            }
        }
    }

    function renderPreview() { 
        let w = 500, h = 500;
        if (params.canvasShape === 'portrait') { w=400; h=500; }
        else if (params.canvasShape === 'landscape') { w=600; h=400; }
        
        previewCanvas.width = w;
        previewCanvas.height = h;
        renderScene(ctx, w, h, true);
    }

    // --- BLOB EXPORT ---
    const btnExport = document.getElementById('btn-export');
    
    btnExport.addEventListener('click', () => {
        btnExport.disabled = true;
        loadingOverlay.style.display = 'flex';
        
        const widthStr = document.getElementById('exportRes').value;
        let targetW = parseInt(widthStr);
        let targetH = targetW;

        if (params.canvasShape === 'portrait') targetH = targetW * 1.25;
        else if (params.canvasShape === 'landscape') targetH = targetW * 0.66;

        loadingMsg.innerText = `Initializing ${targetW}x${targetH} canvas...`;

        setTimeout(() => {
            try {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = targetW;
                offCanvas.height = targetH;
                const offCtx = offCanvas.getContext('2d');

                loadingMsg.innerText = "Calculating Geometry...";
                
                setTimeout(() => {
                    renderScene(offCtx, targetW, targetH, false);
                    
                    loadingMsg.innerText = "Compressing PNG...";

                    offCanvas.toBlob((blob) => {
                        if (!blob) {
                            alert("Browser memory error. Try smaller resolution.");
                            return;
                        }
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement("a");
                        link.download = `Golden_Master_${targetW}px.png`;
                        link.href = url;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);

                        loadingOverlay.style.display = 'none';
                        btnExport.disabled = false;
                    }, 'image/png');

                }, 100);
            } catch (e) {
                alert("Error: Browser out of memory.");
                loadingOverlay.style.display = 'none';
                btnExport.disabled = false;
            }
        }, 100);
    });

    renderPreview();

</script>
</body>
</html>

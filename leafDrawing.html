<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Botany Studio: Real-Time Leaf Architect</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Settings Panel */
        .sidebar {
            width: 340px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header {
            padding: 20px;
            background: #2e7d32;
            color: white;
        }
        .header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 0.8rem; opacity: 0.8; }

        .controls {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group h3 {
            margin: 0 0 10px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #444;
            margin-bottom: 6px;
            margin-top: 10px;
        }
        
        /* Custom Inputs */
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 0.95rem;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #2e7d32;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
        }

        /* Canvas Area */
        .workspace {
            flex-grow: 1;
            background-color: #eef2f3;
            /* Subtle grid for transparency check */
            background-image: 
                linear-gradient(45deg, #e6e6e6 25%, transparent 25%), 
                linear-gradient(-45deg, #e6e6e6 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e6e6e6 75%), 
                linear-gradient(-45deg, transparent 75%, #e6e6e6 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            max-width: 90%;
            max-height: 90%;
            /* Physical drop shadow for the canvas itself (optional) */
            /* filter: drop-shadow(0 20px 50px rgba(0,0,0,0.2)); */
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h1>Botany Studio</h1>
            <p>Real-time Procedural Engine</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <h3>Species</h3>
                <select id="species">
                    <option value="lanceolate">1. Willow (Lanceolate)</option>
                    <option value="ovate">2. Apple (Ovate)</option>
                    <option value="cordate">3. Lilac (Cordate)</option>
                    <option value="lobed">4. Oak (Lobed)</option>
                    <option value="palmate">5. Maple (Palmate)</option>
                    <option value="monstera">6. Monstera (Fenestrated)</option>
                    <option value="ginkgo">7. Ginkgo (Fan)</option>
                    <option value="pinnate">8. Fern (Pinnate Compound)</option>
                </select>
            </div>

            <div class="control-group">
                <h3>Geometry</h3>
                <label>Leaf Width</label>
                <input type="range" id="width" min="0.5" max="2.5" step="0.1" value="1.0">

                <label>Curvature (Bend)</label>
                <input type="range" id="bend" min="-30" max="30" value="10">

                <label>Edge Serration</label>
                <input type="range" id="serration" min="0" max="100" value="20">
            </div>

            <div class="control-group">
                <h3>Venation</h3>
                <label>Vein Density</label>
                <input type="range" id="veinDensity" min="0" max="40" value="20">
                
                <label>Vein Angle</label>
                <input type="range" id="veinAngle" min="20" max="80" value="45">
            </div>

            <div class="control-group">
                <h3>Material</h3>
                <label>Chlorophyll</label>
                <input type="color" id="color" value="#5b8c5a">
                
                <label>Decay / Texture</label>
                <input type="range" id="texture" min="0" max="100" value="30">
            </div>
        </div>
    </div>

    <div class="workspace">
        <canvas id="canvas" width="1000" height="1000"></canvas>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // UI References
    const ui = {
        species: document.getElementById('species'),
        width: document.getElementById('width'),
        bend: document.getElementById('bend'),
        serration: document.getElementById('serration'),
        veinDensity: document.getElementById('veinDensity'),
        veinAngle: document.getElementById('veinAngle'),
        color: document.getElementById('color'),
        texture: document.getElementById('texture')
    };

    // Attach real-time listeners
    Object.values(ui).forEach(el => {
        el.addEventListener('input', requestDraw);
    });

    let animationFrame;
    function requestDraw() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(render);
    }

    // --- MAIN RENDER LOOP ---
    function render() {
        // Clear Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const params = {
            type: ui.species.value,
            wFactor: parseFloat(ui.width.value),
            bend: parseInt(ui.bend.value),
            jagged: parseInt(ui.serration.value),
            vDens: parseInt(ui.veinDensity.value),
            vAng: parseInt(ui.veinAngle.value) * (Math.PI / 180),
            color: ui.color.value,
            noise: parseInt(ui.texture.value)
        };

        const cx = canvas.width / 2;
        const cy = canvas.height * 0.9; // Start at bottom
        const len = 700;

        ctx.save();
        
        // 1. Generate the Spine (The backbone of the leaf)
        // We calculate this first because veins and shape depend on it
        const spine = generateSpine(cx, cy, len, params.bend);

        // 2. Draw Leaf
        // We split logic: Compound leaves (Pinnate) vs Single Blades
        if (params.type === 'pinnate') {
            drawCompoundLeaf(spine, params);
        } else {
            drawSingleBlade(spine, params);
        }

        // 3. Draw Stem
        drawStem(spine[0]);

        ctx.restore();
    }

    // --- DRAWING LOGIC: SINGLE BLADE ---
    function drawSingleBlade(spine, params) {
        // Generate the complex polygon for the leaf edge
        const outline = generateOutline(spine, params);
        
        // Setup Shadow for the whole leaf
        ctx.shadowBlur = 30;
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.shadowOffsetY = 15;

        // Draw Base Shape
        ctx.fillStyle = params.color;
        // Gradient for depth
        const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grd.addColorStop(0, adjustColor(params.color, 40)); // Lighter top
        grd.addColorStop(1, adjustColor(params.color, -30)); // Darker bottom
        ctx.fillStyle = grd;

        ctx.fill(outline);
        
        // Clear shadow for internal details
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // Clip to inside of leaf for veins and texture
        ctx.save();
        ctx.clip(outline);

        // Veins
        drawVeins(spine, params, false);

        // Texture (Cellular Noise)
        if (params.noise > 0) applyTexture(params.noise);

        // Fenestrations (Holes for Monstera)
        if (params.type === 'monstera') cutHoles(spine, params);

        ctx.restore();
        
        // Draw Midrib (Spine) on top
        drawMidrib(spine);
    }

    // --- DRAWING LOGIC: COMPOUND (PINNATE) ---
    function drawCompoundLeaf(spine, params) {
        // For pinnate, we draw many small "leaflets" along the spine.
        // To get shadows between them, we draw them individually.
        
        const leafletCount = 10 + Math.floor(params.vDens / 5);
        
        // Draw Spine (Rachis) first so leaflets sit on top/below appropriately
        drawMidrib(spine);

        // We iterate backwards (tip to base) so lower leaflets cast shadows on upper ones? 
        // Or base to tip? Usually tip overlaps base in ferns. Let's do Base to Tip.
        
        for (let i = 0; i < leafletCount; i++) {
            const t = 0.1 + (i / leafletCount) * 0.8;
            const idx = Math.floor(t * (spine.length - 1));
            const pos = spine[idx];
            
            // Tangent calculation for rotation
            const nextPos = spine[Math.min(idx + 1, spine.length - 1)];
            const dx = nextPos.x - pos.x;
            const dy = nextPos.y - pos.y;
            const spineAngle = Math.atan2(dy, dx); // Angle of spine pointing UP

            // Scale leaflets based on position (smaller at top/bottom)
            // Sine wave distribution
            const scale = Math.sin(t * Math.PI) * 120 * params.wFactor;
            
            // Draw Left and Right Leaflets
            // We pass a localized spine for the leaflet to allow veins inside it
            
            // Left (-90 deg + offset)
            drawLeaflet(pos.x, pos.y, spineAngle - 1.2, scale, params);
            // Right (+90 deg - offset)
            drawLeaflet(pos.x, pos.y, spineAngle + 1.2, scale, params);
        }
        
        // Terminal Leaflet (Top)
        const tip = spine[spine.length - 1];
        const tipAngle = Math.atan2(spine[spine.length-1].y - spine[spine.length-5].y, spine[spine.length-1].x - spine[spine.length-5].x);
        drawLeaflet(tip.x, tip.y, tipAngle, 80 * params.wFactor, params);
    }

    function drawLeaflet(cx, cy, angle, len, params) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle); // Rotate to face outward
        
        // Shadow per leaflet! This is what gives the "Stacking" look
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        const path = new Path2D();
        path.moveTo(0, 0);
        
        // Simple Lanceolate/Ovate shape for leaflet
        const steps = 20;
        for(let i=0; i<=steps; i++) {
            let t = i/steps;
            let w = Math.sin(t * Math.PI) * (len * 0.3);
            if (params.jagged > 0) w += (Math.random()-0.5) * (params.jagged/10);
            path.lineTo(t*len, w);
        }
        path.lineTo(len, 0); // Tip
        for(let i=steps; i>=0; i--) {
            let t = i/steps;
            let w = Math.sin(t * Math.PI) * (len * 0.3);
            if (params.jagged > 0) w += (Math.random()-0.5) * (params.jagged/10);
            path.lineTo(t*len, -w);
        }
        path.closePath();

        // Fill
        const c = hexToRgb(params.color);
        ctx.fillStyle = `rgb(${c.r}, ${c.g}, ${c.b})`;
        ctx.fill(path);

        // Inner Vein (Simple)
        ctx.shadowBlur = 0; // Turn off shadow for vein
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(len * 0.8, 0);
        ctx.stroke();

        ctx.restore();
    }

    // --- GEOMETRY GENERATORS ---

    function generateSpine(cx, cy, len, bendDeg) {
        const points = [];
        const steps = 100;
        const rad = bendDeg * (Math.PI / 180);
        
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            // Quadratic Curve
            // We bend X based on T
            const x = cx + Math.sin(t * Math.PI) * (len * 0.2) * (rad * 2);
            const y = cy - (t * len);
            points.push({ x, y, t });
        }
        return points;
    }

    function generateOutline(spine, params) {
        const path = new Path2D();
        const leftPoints = [];
        const rightPoints = [];
        const len = 700; // Ref to max length
        
        spine.forEach((pt, i) => {
            const t = pt.t; // 0 (base) to 1 (tip)
            
            // Calculate Tangent for perpendicular width
            const next = spine[Math.min(i+1, spine.length-1)];
            const prev = spine[Math.max(i-1, 0)];
            const angle = Math.atan2(next.y - prev.y, next.x - prev.x);
            const perp = angle + Math.PI/2;

            let w = 0;

            // --- SHAPE ALGORITHMS ---
            if (params.type === 'lanceolate') { // Willow
                w = Math.sin(t * Math.PI) * 100;
            } 
            else if (params.type === 'ovate') { // Apple
                w = Math.sin(t * Math.PI) * Math.pow(1-t, 0.3) * 200;
            }
            else if (params.type === 'cordate') { // Lilac/Heart
                w = Math.sin(t * Math.PI) * (1 - t * 0.5) * 250;
                if(t < 0.2) w += (0.2-t)*300; // Base bulge
            }
            else if (params.type === 'lobed') { // Oak
                const base = Math.sin(t * Math.PI);
                const lobes = Math.abs(Math.cos(t * Math.PI * 3));
                w = base * (100 + lobes * 120);
            }
            else if (params.type === 'palmate') { // Maple
                const base = Math.sin(t * Math.PI);
                const spikes = Math.cos(t * Math.PI * 5); 
                let mod = spikes > 0 ? spikes : spikes * 0.2; // Sharp dips
                w = base * (100 + mod * 150);
            }
            else if (params.type === 'monstera') {
                w = Math.sin(t * Math.PI) * 250; // Big oval base
                if(t < 0.15) w += (0.15-t)*200; // Heart top
            }
            else if (params.type === 'ginkgo') {
                // Ginkgo is fan shaped. Starts thin, gets wide at top
                w = t * 300; 
                // Add wavy top
                if(t > 0.9) w += Math.sin(t*50)*10;
            }

            // Global Width Scale
            w *= params.wFactor;

            // Serration (Noise)
            if (params.jagged > 0) {
                const noise = Math.sin(t * 100) * Math.cos(t * 23);
                w += noise * (params.jagged * 0.5);
            }

            // Coordinates
            // We use the perpendicular angle to project width
            leftPoints.push({
                x: pt.x + Math.cos(perp) * w,
                y: pt.y + Math.sin(perp) * w
            });
            rightPoints.push({
                x: pt.x - Math.cos(perp) * w,
                y: pt.y - Math.sin(perp) * w
            });
        });

        // Construct Path
        path.moveTo(spine[0].x, spine[0].y);
        leftPoints.forEach(p => path.lineTo(p.x, p.y));
        path.lineTo(spine[spine.length-1].x, spine[spine.length-1].y); // Tip
        for (let i = rightPoints.length - 1; i >= 0; i--) {
            path.lineTo(rightPoints[i].x, rightPoints[i].y);
        }
        path.closePath();

        return path;
    }

    // --- VEIN SYSTEM (CORRECTED) ---

    function drawVeins(spine, params, isPinnate) {
        if (params.vDens <= 0) return;

        ctx.beginPath();
        
        // How many veins?
        const step = Math.floor(100 / (params.vDens + 2));
        
        for (let i = 10; i < spine.length - 15; i += step) {
            const pos = spine[i];
            
            // Calculate Spine Direction (Tangent)
            // Vector pointing from base towards tip
            const next = spine[Math.min(i+2, spine.length-1)];
            const prev = spine[Math.max(i-2, 0)];
            const dx = next.x - prev.x;
            const dy = next.y - prev.y; // Usually negative (going up)
            const spineAngle = Math.atan2(dy, dx); 

            // Branching Angle
            // We want the veins to point TOWARDS the tip.
            // So we add/subtract from the spine angle.
            // If spineAngle is -90deg (Up), Left vein should be -135, Right -45
            
            // Left Vein
            const leftAngle = spineAngle - params.vAng;
            const rightAngle = spineAngle + params.vAng;

            const veinLen = 200 * params.wFactor; // Max length, clipped by mask anyway

            // Draw Left
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(
                pos.x + Math.cos(leftAngle) * veinLen,
                pos.y + Math.sin(leftAngle) * veinLen
            );

            // Draw Right
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(
                pos.x + Math.cos(rightAngle) * veinLen,
                pos.y + Math.sin(rightAngle) * veinLen
            );
        }

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.stroke();
        
        // Highlight (Emboss effect)
        ctx.beginPath();
        // Shift slightly and draw white for 3D effect
        ctx.save();
        ctx.translate(0, 1);
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.stroke(); 
        ctx.restore();
    }

    function drawMidrib(spine) {
        ctx.beginPath();
        ctx.moveTo(spine[0].x, spine[0].y);
        for(let i=1; i<spine.length; i++) ctx.lineTo(spine[i].x, spine[i].y);
        
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.stroke();
        
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.stroke();
    }

    function drawStem(basePt) {
        ctx.beginPath();
        ctx.moveTo(basePt.x, basePt.y);
        ctx.quadraticCurveTo(basePt.x, basePt.y + 50, basePt.x, basePt.y + 80);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#5d4037';
        ctx.stroke();
    }

    function cutHoles(spine, params) {
        // Destination-out to punch holes
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'black';
        
        const count = 5 + Math.floor(Math.random() * 5);
        for(let i=0; i<count; i++) {
            // Random spots along spine
            const idx = 20 + Math.floor(Math.random() * 50);
            const pt = spine[idx];
            const size = 15 + Math.random() * 20;
            const offset = 40 + Math.random() * 80;
            
            // Left Hole
            ctx.beginPath();
            ctx.ellipse(pt.x - offset, pt.y, size, size*0.6, 0.5, 0, Math.PI*2);
            ctx.fill();

            // Right Hole
            ctx.beginPath();
            ctx.ellipse(pt.x + offset, pt.y, size, size*0.6, -0.5, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
    }

    function applyTexture(strength) {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
            // Only modify pixels that are not fully transparent
            if (data[i + 3] > 10) { 
                const noise = (Math.random() - 0.5) * strength;
                data[i] += noise;     // R
                data[i + 1] += noise; // G
                data[i + 2] += noise; // B
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    // Utils
    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }
    
    function adjustColor(color, amount) {
        const c = hexToRgb(color);
        const r = Math.max(0, Math.min(255, c.r + amount));
        const g = Math.max(0, Math.min(255, c.g + amount));
        const b = Math.max(0, Math.min(255, c.b + amount));
        return `rgb(${r},${g},${b})`;
    }

    // Init
    render();

</script>
</body>
</html>

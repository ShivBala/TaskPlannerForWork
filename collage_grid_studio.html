<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grid Studio</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #2b2b2b;
            --text-color: #f0f0f0;
            --accent-color: #3b82f6;
            --highlight-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            background-color: var(--panel-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.4);
            overflow-y: auto;
            z-index: 10;
        }

        h2, h3 { margin: 0; font-weight: 500; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; color: var(--accent-color); }
        h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-top: 10px; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #333;
            padding: 10px;
            border-radius: 6px;
        }

        label { font-size: 0.85rem; color: #ccc; }

        input, button {
            background: #444;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        input[type="color"] { height: 40px; width: 100%; cursor: pointer; padding: 2px; }
        
        button {
            background-color: var(--accent-color);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        
        .download-btn { background-color: #10b981; margin-top: auto; }

        .instructions {
            font-size: 0.8rem;
            color: #aaa;
            background: #222;
            padding: 10px;
            border-left: 3px solid var(--highlight-color);
            line-height: 1.4;
        }

        /* Main Canvas Area */
        .workspace {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-image: 
                linear-gradient(45deg, #252525 25%, transparent 25%), 
                linear-gradient(-45deg, #252525 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #252525 75%), 
                linear-gradient(-45deg, transparent 75%, #252525 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            max-width: 95%;
            max-height: 95%;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        /* Current Selection Indicator in Sidebar */
        #selectionInfo {
            font-size: 0.8rem;
            color: var(--highlight-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Smart Grid Studio</h2>
        
        <div class="instructions">
            <strong>How to Interact:</strong><br>
            • <strong>Click</strong> an image to select it.<br>
            • <strong>Drag</strong> to move the image inside its cell.<br>
            • <strong>Scroll Wheel</strong> to zoom in/out.<br>
        </div>

        <h3>Global Settings</h3>
        
        <div class="control-group">
            <label>Upload Images</label>
            <input type="file" id="imageInput" multiple accept="image/*">
        </div>

        <div class="control-group">
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Columns</label>
                    <input type="number" id="colCount" value="3" min="1">
                </div>
                <div style="flex:1">
                    <label>Rows</label>
                    <input type="number" id="rowCount" value="2" min="1">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Canvas Size (Output)</label>
            <div style="display:flex; gap:10px;">
                <input type="number" id="outputWidth" value="1920" placeholder="W">
                <input type="number" id="outputHeight" value="1080" placeholder="H">
            </div>
        </div>

        <div class="control-group">
            <label>Gap (px)</label>
            <input type="number" id="gridGap" value="20" min="0">
        </div>

        <div class="control-group">
            <label>Background Fill Color</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>

        <h3>Selected Image</h3>
        <div id="selectionInfo">No image selected</div>
        <div class="control-group">
            <label>Zoom Level</label>
            <input type="range" id="manualZoom" min="0.1" max="5" step="0.1" value="1">
            <button onclick="resetSelected()">Reset Selection to Fit</button>
        </div>

        <button class="download-btn" onclick="downloadImage()">Download High-Res</button>
    </div>

    <div class="workspace">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // State Management
        let appState = {
            images: [], // Holds { imgObj, x, y, scale, cellIndex }
            config: {
                cols: 3,
                rows: 2,
                width: 1920,
                height: 1080,
                gap: 20,
                bgColor: "#ffffff"
            },
            selection: -1, // Index of currently selected image
            isDragging: false,
            lastMouse: { x: 0, y: 0 }
        };

        // DOM Elements
        const inputs = {
            cols: document.getElementById('colCount'),
            rows: document.getElementById('rowCount'),
            w: document.getElementById('outputWidth'),
            h: document.getElementById('outputHeight'),
            gap: document.getElementById('gridGap'),
            bg: document.getElementById('bgColor'),
            zoom: document.getElementById('manualZoom'),
            info: document.getElementById('selectionInfo')
        };

        // --- Event Listeners for Controls ---
        Object.values(inputs).forEach(el => {
            if(el.type !== 'range') el.addEventListener('input', updateConfig);
        });
        
        inputs.zoom.addEventListener('input', (e) => {
            if (appState.selection !== -1) {
                appState.images[appState.selection].scale = parseFloat(e.target.value);
                draw();
            }
        });

        document.getElementById('imageInput').addEventListener('change', handleUpload);

        // --- Canvas Interaction Logic ---
        
        // Mouse Down: Select and Start Drag
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Find which cell was clicked
            const cellDims = getCellDimensions();
            const col = Math.floor(clickX / (cellDims.width + appState.config.gap));
            const row = Math.floor(clickY / (cellDims.height + appState.config.gap));
            
            // Map grid coords to image index
            const index = row * appState.config.cols + col;

            if (index >= 0 && index < appState.images.length) {
                appState.selection = index;
                appState.isDragging = true;
                appState.lastMouse = { x: e.clientX, y: e.clientY };
                
                // Update UI to match selected image
                inputs.zoom.value = appState.images[index].scale;
                inputs.info.innerText = `Editing Image #${index + 1}`;
                draw(); // Redraw to show selection highlight
            } else {
                appState.selection = -1;
                inputs.info.innerText = "No image selected";
                draw();
            }
        });

        // Mouse Move: Pan Image
        window.addEventListener('mousemove', e => {
            if (!appState.isDragging || appState.selection === -1) return;

            // Calculate delta based on visual size vs canvas size
            const rect = canvas.getBoundingClientRect();
            const scaleRatio = canvas.width / rect.width; // Mapping screen pixels to canvas pixels

            const dx = (e.clientX - appState.lastMouse.x) * scaleRatio;
            const dy = (e.clientY - appState.lastMouse.y) * scaleRatio;

            appState.images[appState.selection].x += dx;
            appState.images[appState.selection].y += dy;

            appState.lastMouse = { x: e.clientX, y: e.clientY };
            draw();
        });

        window.addEventListener('mouseup', () => {
            appState.isDragging = false;
        });

        // Scroll Wheel: Zoom
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            if (appState.selection !== -1) {
                const speed = 0.05;
                const dir = e.deltaY > 0 ? -1 : 1;
                let newScale = appState.images[appState.selection].scale + (dir * speed);
                
                // Limits
                if (newScale < 0.1) newScale = 0.1;
                if (newScale > 10) newScale = 10;

                appState.images[appState.selection].scale = newScale;
                inputs.zoom.value = newScale;
                draw();
            }
        });


        // --- Core Functions ---

        function updateConfig() {
            appState.config.cols = parseInt(inputs.cols.value) || 1;
            appState.config.rows = parseInt(inputs.rows.value) || 1;
            appState.config.width = parseInt(inputs.w.value) || 1000;
            appState.config.height = parseInt(inputs.h.value) || 1000;
            appState.config.gap = parseInt(inputs.gap.value) || 0;
            appState.config.bgColor = inputs.bg.value;
            draw();
        }

        function handleUpload(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            appState.images = []; // Clear current
            appState.selection = -1;

            let loaded = 0;
            files.forEach(file => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    img.onload = () => {
                        // Initialize image state
                        appState.images.push({
                            obj: img,
                            x: 0, // Offset from center
                            y: 0,
                            scale: 1.0 
                        });
                        loaded++;
                        if(loaded === files.length) {
                            // Sort images? Currently pushes as they load. 
                            // Could sort by filename here if needed.
                            draw();
                        }
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function getCellDimensions() {
            const { width, height, cols, rows, gap } = appState.config;
            const cellW = (width - (cols - 1) * gap) / cols;
            const cellH = (height - (rows - 1) * gap) / rows;
            return { width: cellW, height: cellH };
        }

        function resetSelected() {
            if(appState.selection !== -1) {
                appState.images[appState.selection].x = 0;
                appState.images[appState.selection].y = 0;
                appState.images[appState.selection].scale = 1.0;
                inputs.zoom.value = 1.0;
                draw();
            }
        }

        function draw() {
            // 1. Setup Canvas
            canvas.width = appState.config.width;
            canvas.height = appState.config.height;
            const { width: cellW, height: cellH } = getCellDimensions();
            const { gap, cols, bgColor } = appState.config;

            // 2. Fill Background (Gaps color)
            ctx.fillStyle = bgColor; // Use user selected color for everything
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Render Images
            appState.images.forEach((imgData, index) => {
                // Calculate Grid Position
                const col = index % cols;
                const row = Math.floor(index / cols);
                
                // Stop if outside defined grid
                if (row >= appState.config.rows) return;

                const cellX = col * (cellW + gap);
                const cellY = row * (cellH + gap);

                // Save context for clipping
                ctx.save();
                
                // Create Clipping Region (The Cell)
                ctx.beginPath();
                ctx.rect(cellX, cellY, cellW, cellH);
                ctx.clip();

                // Draw Background for this specific cell (user choice)
                ctx.fillStyle = bgColor;
                ctx.fillRect(cellX, cellY, cellW, cellH);

                // Calculate "Contain" fit
                const img = imgData.obj;
                const ratio = Math.min(cellW / img.width, cellH / img.height);
                
                // Determine base size (fitted)
                const fittedW = img.width * ratio;
                const fittedH = img.height * ratio;

                // Determine final size (with user zoom)
                const finalW = fittedW * imgData.scale;
                const finalH = fittedH * imgData.scale;

                // Center position + User Offset
                const centerX = cellX + (cellW / 2);
                const centerY = cellY + (cellH / 2);
                
                const drawX = centerX - (finalW / 2) + imgData.x;
                const drawY = centerY - (finalH / 2) + imgData.y;

                ctx.drawImage(img, drawX, drawY, finalW, finalH);

                // Visual Highlight for Selection
                if (appState.selection === index) {
                    ctx.strokeStyle = '#f59e0b'; // Highlight color
                    ctx.lineWidth = Math.max(5, canvas.width * 0.005); // Dynamic thickness
                    ctx.strokeRect(cellX, cellY, cellW, cellH);
                }

                ctx.restore();
            });
        }

        function downloadImage() {
            // Temporarily unselect to remove highlight border
            const prevSelection = appState.selection;
            appState.selection = -1;
            draw();

            const link = document.createElement('a');
            link.download = 'smart-grid-result.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();

            // Restore selection
            appState.selection = prevSelection;
            draw();
        }

        // Initial Draw
        draw();

    </script>
</body>
</html>

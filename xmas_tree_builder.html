<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-System Xmas Tree Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        h1 {
            font-family: 'Mountains of Christmas', cursive;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #10b981;
            cursor: pointer;
            border-radius: 50%;
        }
        
        .custom-checkbox {
            accent-color: #10b981;
        }

        .control-group {
            border-left: 2px solid #334155;
            padding-left: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar Controls -->
    <div class="w-full md:w-96 bg-slate-900 border-r border-slate-700 flex flex-col h-full overflow-y-auto z-10 shadow-xl">
        <div class="p-5 border-b border-slate-700 bg-slate-900 sticky top-0 z-20">
            <h1 class="text-3xl text-green-400 font-bold mb-1"><i class="fa-solid fa-tree mr-2"></i>L-Tree Gen</h1>
            <p class="text-xs text-slate-400">Procedural Christmas Tree Engine</p>
        </div>

        <div class="p-5 space-y-6">
            
            <!-- Themes -->
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                <label class="block text-xs font-bold text-green-400 mb-2 uppercase tracking-wider">Apply Color Theme</label>
                <select id="themeSelector" class="w-full bg-slate-900 border border-slate-600 text-sm rounded p-2 focus:outline-none focus:border-green-500 text-white">
                    <option value="festive">Classic Festive</option>
                    <option value="winter">Winter Frost</option>
                    <option value="snow">Snow White</option>
                    <option value="summer">Summer Bloom</option>
                    <option value="subtle">Subtle Elegance</option>
                    <option value="midnight">Midnight Glow</option>
                    <option value="candy">Candy Cane</option>
                    <option value="golden">Golden Hour</option>
                </select>
                <p class="text-[10px] text-slate-500 mt-1">Changes colors only. Keeps your shape.</p>
            </div>

            <!-- Structure -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-1">Structure</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="flex justify-between text-[10px] mb-1">Height</label>
                        <input type="range" id="iterations" min="5" max="10" step="1" value="9" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                    </div>
                    <div>
                        <label class="flex justify-between text-[10px] mb-1">Width</label>
                        <input type="range" id="coneAngle" min="5" max="90" step="1" value="16" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="flex justify-between text-[10px] mb-1">Branch Angle</label>
                        <input type="range" id="angle" min="10" max="45" step="1" value="25" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                    </div>
                    <div>
                        <label class="flex justify-between text-[10px] mb-1">Length</label>
                        <input type="range" id="len" min="30" max="100" step="5" value="60" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                    </div>
                </div>
            </div>

            <!-- Foliage Colors -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-1">Foliage Palette</h3>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs mb-1">Inner/Short</label>
                        <input type="color" id="leafColorStart" value="#143625" class="w-full h-6 rounded cursor-pointer bg-slate-800 p-0.5">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Outer/Long</label>
                        <input type="color" id="leafColorEnd" value="#4ade80" class="w-full h-6 rounded cursor-pointer bg-slate-800 p-0.5">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mt-2">
                     <div>
                        <label class="block text-xs mb-1">Shadow Color</label>
                        <input type="color" id="shadowColor" value="#000000" class="w-full h-6 rounded cursor-pointer bg-slate-800 p-0.5">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Shadow Offset</label>
                        <input type="range" id="shadowOffset" min="0" max="20" step="0.5" value="1.5" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-2">
                     <div>
                        <label class="block text-xs mb-1">Wood Base</label>
                        <input type="color" id="woodColorStart" value="#3e2723" class="w-full h-6 rounded cursor-pointer bg-slate-800 p-0.5">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Wood Tip</label>
                        <input type="color" id="woodColorEnd" value="#8d6e63" class="w-full h-6 rounded cursor-pointer bg-slate-800 p-0.5">
                    </div>
                </div>

                <div>
                    <label class="flex justify-between text-xs mb-1">Frost Effect <span id="val-frost">30%</span></label>
                    <input type="range" id="frost" min="0" max="100" step="5" value="30" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
                </div>
            </div>

            <!-- Decor -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-1">Decorations</h3>
                
                <!-- Density -->
                <div>
                    <label class="flex justify-between text-xs mb-1">Total Density <span id="val-baubleProb">20%</span></label>
                    <input type="range" id="baubleProb" min="0" max="100" step="5" value="20" class="w-full h-2 bg-slate-700 rounded-lg appearance-none slider-thumb">
                </div>

                <!-- Baubles Control -->
                <div class="control-group">
                    <label class="flex items-center space-x-2 text-sm font-semibold mb-2 cursor-pointer">
                        <input type="checkbox" id="hasBaubles" class="custom-checkbox w-4 h-4 rounded bg-slate-700" checked>
                        <span>Baubles</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                         <div>
                            <label class="text-[10px] block mb-1">Size</label>
                            <input type="range" id="baubleSize" min="2" max="12" value="5" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                        <div class="flex gap-1">
                             <input type="color" id="baubleColor1" value="#ef4444" class="flex-1 h-6 rounded bg-slate-800 p-0.5">
                             <input type="color" id="baubleColor2" value="#fbbf24" class="flex-1 h-6 rounded bg-slate-800 p-0.5">
                        </div>
                    </div>
                </div>

                <!-- Stars Control -->
                <div class="control-group">
                    <div class="flex justify-between mb-2">
                        <span class="text-sm font-semibold">Stars</span>
                        <div class="space-x-3">
                            <label class="text-[10px] cursor-pointer"><input type="checkbox" id="hasStarTopper" class="custom-checkbox" checked> Topper</label>
                            <label class="text-[10px] cursor-pointer"><input type="checkbox" id="hasStarScatter" class="custom-checkbox"> Scatter</label>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                         <div>
                            <label class="text-[10px] block mb-1">Scatter Size</label>
                            <input type="range" id="starSize" min="4" max="20" value="8" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                        <div>
                             <label class="text-[10px] block mb-1">Top Size</label>
                             <input type="range" id="topStarSize" min="10" max="50" value="25" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-1">
                         <div>
                             <label class="text-[10px] block mb-1">Scatter Color</label>
                             <input type="color" id="starColor" value="#FFD700" class="w-full h-6 rounded bg-slate-800 p-0.5">
                         </div>
                         <div>
                             <label class="text-[10px] block mb-1">Top Color</label>
                             <input type="color" id="topStarColor" value="#FFD700" class="w-full h-6 rounded bg-slate-800 p-0.5">
                         </div>
                    </div>
                </div>

                <!-- Lights Control -->
                <div class="control-group">
                    <label class="flex items-center space-x-2 text-sm font-semibold mb-2 cursor-pointer">
                        <input type="checkbox" id="hasLights" class="custom-checkbox w-4 h-4 rounded bg-slate-700" checked>
                        <span>Fairy Lights</span>
                    </label>
                    <div class="grid grid-cols-3 gap-2 items-end">
                         <div class="col-span-1">
                            <label class="text-[10px] block mb-1">Size</label>
                            <input type="range" id="lightSize" min="1" max="6" value="3" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                         <div class="col-span-1">
                            <label class="text-[10px] block mb-1">Glow</label>
                            <input type="range" id="glow" min="0" max="40" value="15" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                        <div class="col-span-1">
                             <input type="color" id="lightColor" value="#ffffaa" class="w-full h-6 rounded bg-slate-800 p-0.5">
                        </div>
                    </div>
                </div>

                <!-- Stockings Control -->
                <div class="control-group">
                    <label class="flex items-center space-x-2 text-sm font-semibold mb-2 cursor-pointer">
                        <input type="checkbox" id="hasStockings" class="custom-checkbox w-4 h-4 rounded bg-slate-700">
                        <span>Stockings</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                         <div>
                            <label class="text-[10px] block mb-1">Size</label>
                            <input type="range" id="stockingSize" min="4" max="15" value="8" class="w-full h-1 bg-slate-700 rounded-lg appearance-none slider-thumb">
                        </div>
                        <div>
                             <label class="text-[10px] block mb-1">Color</label>
                             <input type="color" id="stockingColor" value="#d32f2f" class="w-full h-6 rounded bg-slate-800 p-0.5">
                        </div>
                    </div>
                </div>

                <!-- Ribbons -->
                <div class="control-group">
                     <label class="flex items-center space-x-2 text-xs cursor-pointer mb-2">
                        <input type="checkbox" id="hasRibbons" class="custom-checkbox w-4 h-4 rounded bg-slate-700 border-slate-600">
                        <span class="font-semibold">Ribbons</span>
                    </label>
                    <div class="space-y-2">
                        <select id="ribbonColor" class="w-full bg-slate-800 border border-slate-600 text-[10px] rounded p-1 focus:outline-none focus:border-green-500 text-white">
                            <option value="#FFD700">Gold</option>
                            <option value="#9e1b32">Ruby Red</option>
                            <option value="#e0e0e0">Bright Silver</option>
                            <option value="#008f7d">Emerald Blue</option>
                        </select>
                         <label class="flex items-center space-x-2 text-[10px] cursor-pointer">
                            <input type="checkbox" id="ribbonTexture" class="custom-checkbox w-3 h-3 rounded bg-slate-700 border-slate-600" checked>
                            <span>Textured / Dusty</span>
                        </label>
                    </div>
                </div>

            </div>

            <!-- Actions -->
            <div class="pt-4 space-y-2">
                <button id="generateBtn" class="w-full py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded shadow-lg transition transform active:scale-95">
                    <i class="fa-solid fa-arrows-rotate mr-2"></i> Regenerate Tree
                </button>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="dlPng" class="py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded transition">
                        <i class="fa-solid fa-image mr-1"></i> PNG
                    </button>
                    <button id="dlSvg" class="py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded transition">
                        <i class="fa-solid fa-bezier-curve mr-1"></i> SVG
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="saveCsv" class="py-2 bg-blue-900 hover:bg-blue-800 text-white text-xs font-semibold rounded transition text-center">
                        <i class="fa-solid fa-download mr-1"></i> Save Config
                    </button>
                    <label class="py-2 bg-blue-900 hover:bg-blue-800 text-white text-xs font-semibold rounded transition text-center cursor-pointer">
                        <i class="fa-solid fa-upload mr-1"></i> Load Config
                        <input type="file" id="loadCsv" accept=".csv" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas Area -->
    <div class="flex-1 bg-slate-950 relative flex items-center justify-center overflow-hidden" id="canvas-container">
        <!-- Background Gradient -->
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900 via-slate-900 to-indigo-950 opacity-80 z-0"></div>
        
        <!-- Stars/Snow (Static CSS for simplicity) -->
        <div class="absolute inset-0 opacity-30 pointer-events-none" style="background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px;"></div>

        <canvas id="treeCanvas" class="relative z-10 shadow-2xl rounded-sm"></canvas>
        
        <div class="absolute bottom-4 right-4 text-slate-500 text-xs z-10 text-right opacity-50">
            Render Mode: Per-Needle Shading<br>
            Z-Sorted Geometry
        </div>
    </div>

    <script>
        /**
         * L-System & Rendering Logic
         */

        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        
        let svgContent = "";
        let svgWidth = 0;
        let svgHeight = 0;
        let renderQueue = [];
        let debounceTimer = null;

        // State
        const params = {
            // User Preferred Shape Defaults
            iterations: 9,
            coneAngle: 16,
            angle: 25,
            initialLength: 60,
            widthDecay: 0.7,
            
            // Colors
            leafColorStart: '#143625', // Dark Inner
            leafColorEnd: '#4ade80',   // Light Outer
            shadowColor: '#000000',
            shadowOffset: 1.5,
            woodColorStart: '#3e2723',
            woodColorEnd: '#8d6e63',

            // Decor Settings
            hasBaubles: true,
            baubleProb: 0.2, 
            baubleSize: 5,
            baubleColor1: '#ef4444',
            baubleColor2: '#fbbf24',

            hasStarTopper: true,
            hasStarScatter: false,
            starSize: 8,
            topStarSize: 25,
            starColor: '#FFD700',
            topStarColor: '#FFD700',

            hasLights: true,
            lightSize: 3,
            lightColor: '#ffffaa',
            glow: 15,

            hasStockings: false,
            stockingSize: 8,
            stockingColor: '#d32f2f',

            hasRibbons: false,
            ribbonColor: '#FFD700',
            ribbonTexture: true,
            frost: 30
        };

        // Theme Definitions
        const themes = {
            festive: {
                leafColorStart: '#143625', leafColorEnd: '#4ade80',
                woodColorStart: '#3e2723', woodColorEnd: '#8d6e63',
                baubleColor1: '#ef4444', baubleColor2: '#fbbf24',
                starColor: '#FFD700', topStarColor: '#FFD700',
                ribbonColor: '#FFD700', lightColor: '#ffffaa',
                stockingColor: '#d32f2f', shadowColor: '#000000'
            },
            winter: {
                leafColorStart: '#1e293b', leafColorEnd: '#cbd5e1',
                woodColorStart: '#1a202c', woodColorEnd: '#475569',
                baubleColor1: '#60a5fa', baubleColor2: '#e2e8f0',
                starColor: '#e2e8f0', topStarColor: '#f8fafc',
                ribbonColor: '#e0e0e0', lightColor: '#bae6fd',
                stockingColor: '#3b82f6', shadowColor: '#0f172a'
            },
            snow: {
                leafColorStart: '#94a3b8', leafColorEnd: '#ffffff',
                woodColorStart: '#292524', woodColorEnd: '#57534e',
                baubleColor1: '#0ea5e9', baubleColor2: '#f1f5f9',
                starColor: '#bae6fd', topStarColor: '#e0f2fe',
                ribbonColor: '#0ea5e9', lightColor: '#ffffff',
                stockingColor: '#0284c7', shadowColor: '#64748b'
            },
            summer: {
                leafColorStart: '#064e3b', leafColorEnd: '#84cc16',
                woodColorStart: '#78350f', woodColorEnd: '#d97706',
                baubleColor1: '#f43f5e', baubleColor2: '#fbbf24',
                starColor: '#fcd34d', topStarColor: '#f59e0b',
                ribbonColor: '#f59e0b', lightColor: '#fef3c7',
                stockingColor: '#ec4899', shadowColor: '#022c22'
            },
            subtle: {
                leafColorStart: '#2f3e46', leafColorEnd: '#84a98c',
                woodColorStart: '#354f52', woodColorEnd: '#52796f',
                baubleColor1: '#cad2c5', baubleColor2: '#fff1e6',
                starColor: '#fff1e6', topStarColor: '#faedcd',
                ribbonColor: '#d4c5a9', lightColor: '#fefae0',
                stockingColor: '#52796f', shadowColor: '#2f3e46'
            },
            midnight: {
                leafColorStart: '#020617', leafColorEnd: '#1e1b4b',
                woodColorStart: '#000000', woodColorEnd: '#1e293b',
                baubleColor1: '#c084fc', baubleColor2: '#818cf8',
                starColor: '#e879f9', topStarColor: '#d8b4fe',
                ribbonColor: '#a855f7', lightColor: '#e9d5ff',
                stockingColor: '#7e22ce', shadowColor: '#000000'
            },
            candy: {
                leafColorStart: '#334155', leafColorEnd: '#f1f5f9',
                woodColorStart: '#450a0a', woodColorEnd: '#991b1b',
                baubleColor1: '#dc2626', baubleColor2: '#16a34a',
                starColor: '#dc2626', topStarColor: '#ef4444',
                ribbonColor: '#dc2626', lightColor: '#fee2e2',
                stockingColor: '#b91c1c', shadowColor: '#1e293b'
            },
            golden: {
                leafColorStart: '#422006', leafColorEnd: '#a16207',
                woodColorStart: '#431407', woodColorEnd: '#9a3412',
                baubleColor1: '#fbbf24', baubleColor2: '#fcd34d',
                starColor: '#fde68a', topStarColor: '#f59e0b',
                ribbonColor: '#b45309', lightColor: '#fffbeb',
                stockingColor: '#d97706', shadowColor: '#271a0c'
            }
        };

        // UI Element Binding
        const inputs = {
            themeSelector: document.getElementById('themeSelector'),
            iterations: document.getElementById('iterations'),
            coneAngle: document.getElementById('coneAngle'),
            angle: document.getElementById('angle'),
            len: document.getElementById('len'),
            
            leafColorStart: document.getElementById('leafColorStart'),
            leafColorEnd: document.getElementById('leafColorEnd'),
            shadowColor: document.getElementById('shadowColor'),
            shadowOffset: document.getElementById('shadowOffset'),
            woodColorStart: document.getElementById('woodColorStart'),
            woodColorEnd: document.getElementById('woodColorEnd'),
            frost: document.getElementById('frost'),
            
            baubleProb: document.getElementById('baubleProb'),
            
            hasBaubles: document.getElementById('hasBaubles'),
            baubleSize: document.getElementById('baubleSize'),
            baubleColor1: document.getElementById('baubleColor1'),
            baubleColor2: document.getElementById('baubleColor2'),

            hasStarTopper: document.getElementById('hasStarTopper'),
            hasStarScatter: document.getElementById('hasStarScatter'),
            starSize: document.getElementById('starSize'),
            topStarSize: document.getElementById('topStarSize'),
            starColor: document.getElementById('starColor'),
            topStarColor: document.getElementById('topStarColor'),

            hasLights: document.getElementById('hasLights'),
            lightSize: document.getElementById('lightSize'),
            lightColor: document.getElementById('lightColor'),
            glow: document.getElementById('glow'),

            hasStockings: document.getElementById('hasStockings'),
            stockingSize: document.getElementById('stockingSize'),
            stockingColor: document.getElementById('stockingColor'),

            hasRibbons: document.getElementById('hasRibbons'),
            ribbonColor: document.getElementById('ribbonColor'),
            ribbonTexture: document.getElementById('ribbonTexture'),

            generateBtn: document.getElementById('generateBtn'),
            dlPng: document.getElementById('dlPng'),
            dlSvg: document.getElementById('dlSvg'),
            saveCsv: document.getElementById('saveCsv'),
            loadCsv: document.getElementById('loadCsv')
        };

        // --- Color Helper Functions ---

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function interpolateColor(hex1, hex2, factor) {
            const c1 = hexToRgb(hex1);
            const c2 = hexToRgb(hex2);
            const f = Math.max(0, Math.min(1, factor)); 

            const r = Math.round(c1.r + f * (c2.r - c1.r));
            const g = Math.round(c1.g + f * (c2.g - c1.g));
            const b = Math.round(c1.b + f * (c2.b - c1.b));

            return rgbToHex(r, g, b);
        }

        function adjustColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).slice(-2));
        }

        // --- Core Logic ---

        function updateLabels() {
            const setLabel = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            };
            setLabel('val-baubleProb', Math.round(params.baubleProb * 100) + "%");
            setLabel('val-frost', params.frost + "%");
        }

        function applyTheme(themeName) {
            const theme = themes[themeName];
            if (!theme) return;

            // Update Params
            Object.keys(theme).forEach(key => {
                params[key] = theme[key];
            });

            // Update UI Inputs
            inputs.leafColorStart.value = theme.leafColorStart;
            inputs.leafColorEnd.value = theme.leafColorEnd;
            inputs.woodColorStart.value = theme.woodColorStart;
            inputs.woodColorEnd.value = theme.woodColorEnd;
            inputs.baubleColor1.value = theme.baubleColor1;
            inputs.baubleColor2.value = theme.baubleColor2;
            inputs.starColor.value = theme.starColor;
            inputs.topStarColor.value = theme.topStarColor;
            inputs.lightColor.value = theme.lightColor;
            inputs.stockingColor.value = theme.stockingColor;
            inputs.shadowColor.value = theme.shadowColor;
            
            // Handle Ribbon dropdown manually since it has limited options in HTML
            // We check if the theme color matches an option, if not we default or add it dynamically?
            // For now, simpler to just update the visual ribbon color in code.
            // The HTML select for ribbon is restrictive, but params[ribbonColor] overrides it in drawing.
            
            generateAndDraw();
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            svgWidth = canvas.width;
            svgHeight = canvas.height;
            generateAndDraw();
        }

        window.addEventListener('resize', resizeCanvas);

        function addToSVG(type, attrs, textContent = "") {
            let attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
            svgContent += `<${type} ${attrStr}>${textContent}</${type}>\n`;
        }

        // Main Render Loop
        function generateAndDraw() {
            if (!ctx) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            renderQueue = []; 

            const startX = canvas.width / 2;
            const startY = canvas.height - 60;
            
            // Initialize capture tip to something reasonable
            let topTip = { x: startX, y: startY, z: 0 };
            
            function captureTip(x, y, z) {
                if (y < topTip.y) {
                    topTip = { x, y, z };
                }
            }

            generateBranch(startX, startY, 0, -90, 0, params.initialLength, params.iterations * 5, 0, params.iterations, true, captureTip);

            // Star Topper
            if (params.hasStarTopper) {
                // Push the star WAY forward in Z to ensure it sits on top of even thick top branches
                const starZ = topTip.z + 80; 
                renderQueue.push({
                    type: 'star',
                    x: topTip.x, 
                    y: topTip.y - (params.topStarSize * 0.4), 
                    z: starZ, 
                    size: params.topStarSize, 
                    color: params.topStarColor,
                    isTopper: true
                });
            }

            if (params.hasRibbons) {
                generateRibbons(startX, startY, params.iterations);
            }

            renderQueue.sort((a, b) => a.z - b.z);

            svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" style="background-color:#0f172a">`;
            svgContent += `<defs><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;

            renderQueue.forEach(item => {
                if (item.type === 'wood') drawWood(item, startX, startY);
                else if (item.type === 'leaf') drawPineTuft(item, startX, startY);
                else if (item.type === 'decor') drawDecor(item);
                else if (item.type === 'star') drawStar(item);
                else if (item.type === 'ribbon') drawRibbonSegment(item);
            });

            svgContent += `</svg>`;
        }

        function generateRibbons(startX, startY, maxLevels) {
            const turns = 7; // Increased turns for more curls
            const pointsPerTurn = 20;
            const totalSteps = turns * pointsPerTurn;
            const totalHeight = maxLevels * params.initialLength * 0.8;
            
            for (let i = 0; i < totalSteps; i++) {
                const t = i / totalSteps; 
                const tNext = (i + 1) / totalSteps;
                const y = startY - (t * totalHeight);
                const yNext = startY - (tNext * totalHeight);
                const maxRadius = totalHeight * Math.tan(params.coneAngle * Math.PI / 180 / 2);
                // Adjust radius to keep ribbon visible at top
                const r = Math.max(5, (1 - t) * maxRadius * 1.2); 
                const rNext = Math.max(5, (1 - tNext) * maxRadius * 1.2);
                const angle = t * turns * Math.PI * 2;
                const angleNext = tNext * turns * Math.PI * 2;
                const x = startX + r * Math.cos(angle);
                const z = r * Math.sin(angle); 
                const xNext = startX + rNext * Math.cos(angleNext);
                const zNext = rNext * Math.sin(angleNext);

                renderQueue.push({
                    type: 'ribbon',
                    x1: x, y1: y, z1: z,
                    x2: xNext, y2: yNext, z2: zNext,
                    z: (z + zNext) / 2 
                });
            }
        }

        function generateBranch(x, y, z, pitch, yaw, len, width, level, maxLevels, isTrunk, tipCallback) {
            if (isTrunk) tipCallback(x, y, z);
            if (level > maxLevels) return;

            const radPitch = pitch * Math.PI / 180;
            const radYaw = yaw * Math.PI / 180;
            const dY = len * Math.sin(radPitch);
            const hLen = len * Math.cos(radPitch);
            const dX = hLen * Math.cos(radYaw);
            const dZ = hLen * Math.sin(radYaw);
            const endX = x + dX;
            const endY = y + dY;
            const endZ = z + dZ;
            const midZ = (z + endZ) / 2;
            
            // Wood
            if (width > 0.5 || isTrunk) {
                renderQueue.push({
                    type: 'wood',
                    z: midZ,
                    x1: x, y1: y, x2: endX, y2: endY,
                    width: width,
                    isTrunk: isTrunk
                });
            }

            // Foliage
            const isTip = level > maxLevels - 2;
            if (!isTrunk || isTip) {
                const tufts = isTrunk ? 2 : Math.floor(len / 4); 
                for(let i=0; i<=tufts; i++) {
                    const t = i/tufts;
                    const tx = x + (endX - x) * t;
                    const ty = y + (endY - y) * t;
                    const tz = z + (endZ - z) * t;
                    
                    renderQueue.push({
                        type: 'leaf',
                        z: tz + (Math.random() * 2), 
                        x: tx, y: ty,
                        angle: pitch,
                        size: (width * 4) + 2
                    });
                }
            }

            // Recursion
            if (isTrunk) {
                const nextPitch = -90 + (Math.random()*4 - 2);
                generateBranch(endX, endY, endZ, nextPitch, yaw, len * 0.95, width * 0.8, level + 1, maxLevels, true, tipCallback);

                const ratio = level / maxLevels;
                const distFromTop = maxLevels - level;
                const tanVal = Math.tan(params.coneAngle * Math.PI / 180);
                const baseScale = distFromTop * 0.6; 
                const branchLen = (params.initialLength * 0.5) + (params.initialLength * baseScale * tanVal * 0.5);
                const coneScale = (1.0 - ratio); 
                const branchPitch = -10 - (coneScale * 20) - (ratio * 70);
                const branchesInWhorl = Math.max(3, Math.floor(6 + (4 * coneScale))); 
                const whorlOffset = Math.random() * 360;

                for(let i=0; i<branchesInWhorl; i++) {
                    const branchYaw = whorlOffset + (i * (360 / branchesInWhorl)) + (Math.random() * 15);
                    generateBranch(endX, endY, endZ, branchPitch, branchYaw, branchLen, width * 0.5, 1, 3, false, tipCallback); 
                }
            } else {
                if (level < 3) {
                    const subCount = 2;
                    for(let i=0; i<subCount; i++) {
                        const dir = i===0 ? 1 : -1;
                        const newYaw = yaw + (dir * params.angle);
                        const newPitch = pitch + (Math.random() * 15); 
                        generateBranch(endX, endY, endZ, newPitch, newYaw, len * params.widthDecay, width * 0.6, level + 1, 3, false, tipCallback);
                    }
                }
                
                // Decorations
                if (level >= 2) {
                    const r = Math.random();
                    const density = params.baubleProb;

                    // Decor placement logic: Push items "out" so they are visible
                    // We add a random Z offset with a positive bias to pop things out of the foliage
                    const popZ = endZ + (Math.random() * 40 - 10); // -10 to +30 range approx

                    // Probability Logic
                    if (params.hasBaubles && r < density) {
                        renderQueue.push({ type: 'decor', subtype: 'bauble', z: popZ, x: endX, y: endY });
                    } else if (params.hasLights && r < density + 0.15) {
                        renderQueue.push({ type: 'decor', subtype: 'light', z: popZ, x: endX, y: endY });
                    } else if (params.hasStockings && level >= 2 && Math.random() < 0.05) {
                         // Stockings need extra visibility
                         renderQueue.push({ type: 'decor', subtype: 'stocking', z: popZ + 10, x: endX, y: endY });
                    } else if (params.hasStarScatter && Math.random() < 0.05) {
                         // Scatter stars random inside/outside
                         const starZ = endZ + (Math.random() * 60 - 20); 
                         renderQueue.push({ type: 'star', x: endX, y: endY, z: starZ, size: params.starSize, color: params.starColor });
                    }
                }
            }
        }

        // --- Drawing Functions ---

        function drawWood(item, startX, startY) {
            const baseC = params.woodColorStart;
            const tipC = params.woodColorEnd;
            let factor = Math.min(1, Math.abs(item.x1 - startX) / 200);
            let color = interpolateColor(baseC, tipC, factor);
            
            // Z shading
            const maxVariance = (params.frost / 100) * 80; 
            const depthFactor = Math.max(-1, Math.min(1, item.z * 0.005));
            const amt = Math.round(depthFactor * maxVariance);
            color = adjustColor(color, amt);

            ctx.beginPath();
            ctx.moveTo(item.x1, item.y1);
            ctx.lineTo(item.x2, item.y2);
            ctx.lineWidth = item.width;
            ctx.strokeStyle = color;
            ctx.lineCap = "round";
            ctx.stroke();

            addToSVG("line", {
                x1: item.x1.toFixed(1), y1: item.y1.toFixed(1),
                x2: item.x2.toFixed(1), y2: item.y2.toFixed(1),
                stroke: color,
                "stroke-width": item.width.toFixed(1)
            });
        }

        function drawPineTuft(item, startX, startY) {
            const count = 8; 
            const r = item.size; 

            // Base Distance Gradient
            const dist = Math.abs(item.x - startX);
            const maxBaseWidth = params.initialLength * params.iterations * 0.8;
            let distFactor = dist / Math.max(10, maxBaseWidth * ( (item.y + 100) / startY)); 
            distFactor = Math.min(1, distFactor * 2.5);

            // Z Shading Amount
            const maxVariance = (params.frost / 100) * 80; 
            const depthFactor = Math.max(-1, Math.min(1, item.z * 0.005));
            const zAmt = Math.round(depthFactor * maxVariance);

            ctx.lineWidth = 1.5;
            let d = "";

            for(let i=0; i<count; i++) {
                const ang = Math.random() * Math.PI * 2;
                // Length of this specific needle
                const lenRatio = 0.4 + Math.random() * 0.6; // 0.4 to 1.0
                const len = r * lenRatio;
                
                const nx = item.x + Math.cos(ang) * len;
                const ny = item.y + Math.sin(ang) * len;
                
                // === PER NEEDLE COLOR LOGIC ===
                const colorFactor = (distFactor * 0.6) + (lenRatio * 0.4); 
                let needleColor = interpolateColor(params.leafColorStart, params.leafColorEnd, colorFactor);
                needleColor = adjustColor(needleColor, zAmt); // Apply lighting
                
                // Shadow Pass
                if (params.shadowOffset > 0) {
                    ctx.beginPath();
                    ctx.moveTo(item.x + params.shadowOffset, item.y + params.shadowOffset);
                    ctx.lineTo(nx + params.shadowOffset, ny + params.shadowOffset);
                    ctx.strokeStyle = params.shadowColor + "66"; // 40% opacity hex approx
                    ctx.stroke();
                }

                // Main Pass
                ctx.strokeStyle = needleColor;
                ctx.beginPath();
                ctx.moveTo(item.x, item.y);
                ctx.lineTo(nx, ny);
                ctx.stroke();
                
                d += `M${item.x.toFixed(1)},${item.y.toFixed(1)} L${nx.toFixed(1)},${ny.toFixed(1)} `;
            }

            if (item.size > 2) {
                const avgColor = interpolateColor(params.leafColorStart, params.leafColorEnd, distFactor);
                addToSVG("path", { d: d, stroke: avgColor, "stroke-width": 1, fill: "none" });
            }
        }

        function drawDecor(item) {
            if (item.subtype === 'light') {
                const r = params.lightSize;
                ctx.shadowColor = params.lightColor; // Glow matches light color
                ctx.shadowBlur = params.glow;
                ctx.fillStyle = params.lightColor;
                ctx.beginPath();
                ctx.arc(item.x, item.y, r, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                addToSVG("circle", { cx: item.x.toFixed(1), cy: item.y.toFixed(1), r: r, fill: params.lightColor, filter: "url(#glow)" });
            } 
            else if (item.subtype === 'stocking') {
                const s = params.stockingSize / 10; 
                const c = params.stockingColor;
                
                ctx.fillStyle = c;
                ctx.beginPath();
                
                // Rounded Stocking Shape
                ctx.moveTo(item.x - 3*s, item.y);
                ctx.lineTo(item.x - 3*s, item.y + 8*s); // Down leg
                
                // Heel curve
                ctx.bezierCurveTo(item.x - 3*s, item.y + 10*s, item.x, item.y + 10*s, item.x + 2*s, item.y + 8*s);
                
                // Toe section
                ctx.lineTo(item.x + 5*s, item.y + 8*s);
                // Toe curve
                ctx.bezierCurveTo(item.x + 7*s, item.y + 8*s, item.x + 7*s, item.y + 5*s, item.x + 5*s, item.y + 5*s);
                
                // Back to leg
                ctx.lineTo(item.x + 3*s, item.y + 5*s);
                ctx.lineTo(item.x + 3*s, item.y);
                ctx.fill();
                
                // Fluff
                ctx.fillStyle = "#fff";
                ctx.fillRect(item.x - 4*s, item.y, 8*s, 2.5*s);
                
                // SVG fallback (simplified path)
                const d = `M${item.x-3*s},${item.y} V${item.y+8*s} Q${item.x-3*s},${item.y+10*s} ${item.x+2*s},${item.y+8*s} L${item.x+5*s},${item.y+8*s} Q${item.x+7*s},${item.y+8*s} ${item.x+7*s},${item.y+5*s} Q${item.x+7*s},${item.y+5*s} ${item.x+5*s},${item.y+5*s} L${item.x+3*s},${item.y+5*s} V${item.y} Z`;
                addToSVG("path", {d: d, fill: c});
                
            } else {
                // Bauble
                const r = params.baubleSize;
                const seed = Math.sin(item.x * item.y);
                const color = seed > 0 ? params.baubleColor1 : params.baubleColor2;
                
                const grad = ctx.createRadialGradient(item.x-1, item.y-2, 1, item.x, item.y, r);
                grad.addColorStop(0, "#ffffff");
                grad.addColorStop(0.3, color);
                grad.addColorStop(1, "#000000");

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(item.x, item.y, r, 0, Math.PI*2);
                ctx.fill();

                addToSVG("circle", { cx: item.x.toFixed(1), cy: item.y.toFixed(1), r: r, fill: color, stroke:"#222", "stroke-width":0.5 });
            }
        }

        function drawStar(item) {
            const spikes = 5;
            const outerRadius = item.size;
            const innerRadius = item.size / 2;
            let rot = Math.PI / 2 * 3;
            let x = item.x;
            let y = item.y;
            let step = Math.PI / spikes;

            const color = item.color || params.starColor;

            ctx.beginPath();
            ctx.moveTo(item.x, item.y - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = item.x + Math.cos(rot) * outerRadius;
                y = item.y + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = item.x + Math.cos(rot) * innerRadius;
                y = item.y + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(item.x, item.y - outerRadius);
            ctx.closePath();
            
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;

            // SVG
            let pts = "";
            rot = Math.PI / 2 * 3;
            for(let i=0; i<spikes*2; i++) {
               let r = (i%2==0)?outerRadius:innerRadius;
               pts += `${(item.x + Math.cos(rot)*r).toFixed(1)},${(item.y + Math.sin(rot)*r).toFixed(1)} `;
               rot += step;
            }
            addToSVG("polygon", {points: pts, fill: color, filter: "url(#glow)"});
        }
        
        function drawRibbonSegment(item) {
            const color = params.ribbonColor;
            const isTextured = params.ribbonTexture;
            
            ctx.lineWidth = 4;
            
            if (isTextured) {
                // Metallic Gradient Effect
                const grad = ctx.createLinearGradient(item.x1, item.y1, item.x2, item.y2);
                grad.addColorStop(0, color);
                grad.addColorStop(0.4, "#ffffff"); // Shine
                grad.addColorStop(0.6, color);
                grad.addColorStop(1.0, "#222222"); // Shadow
                ctx.strokeStyle = grad;
            } else {
                ctx.strokeStyle = color;
            }

            ctx.shadowColor = color;
            ctx.shadowBlur = 5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(item.x1, item.y1);
            ctx.lineTo(item.x2, item.y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            
            // "Dust" Texture - Random speckles along segment
            if (isTextured) {
                ctx.fillStyle = "#ffffff";
                for(let k=0; k<3; k++) {
                    if(Math.random()>0.5) {
                         const t = Math.random();
                         const dx = item.x1 + (item.x2-item.x1)*t;
                         const dy = item.y1 + (item.y2-item.y1)*t;
                         ctx.fillRect(dx, dy, 1.5, 1.5);
                    }
                }
            }
            
            addToSVG("line", {
                x1: item.x1.toFixed(1), y1: item.y1.toFixed(1),
                x2: item.x2.toFixed(1), y2: item.y2.toFixed(1),
                stroke: color, "stroke-width": 4
            });
        }

        Object.keys(inputs).forEach(key => {
            const el = inputs[key];
            if(!el) return;
            
            const handler = (e) => {
                let val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                
                if (['iterations', 'coneAngle', 'angle', 'len', 'baubleSize', 'starSize', 'topStarSize', 'lightSize', 'stockingSize', 'glow', 'frost'].includes(key)) val = parseInt(val);
                if (key === 'widthDecay' || key === 'shadowOffset') val = parseFloat(val);
                if (key === 'baubleProb') val = parseInt(val) / 100;

                if (key === 'len') params.initialLength = val;
                else params[key] = val;
                
                // Special handling for theme selector
                if (key === 'themeSelector') {
                    applyTheme(val);
                } else {
                    updateLabels();
                    if(debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(generateAndDraw, 50);
                }
            };
            
            if (key === 'saveCsv') {
                 el.addEventListener('click', () => {
                    let csvContent = "data:text/csv;charset=utf-8,Parameter,Value\r\n";
                    Object.entries(params).forEach(([k, v]) => csvContent += `${k},${v}\r\n`);
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", "tree_settings.csv");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
            } else if (key === 'loadCsv') {
                 el.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const lines = event.target.result.split('\n');
                        lines.forEach(line => {
                            const [k, v] = line.split(',');
                            if(k && v && params.hasOwnProperty(k)) {
                                let cleanVal = v.trim();
                                if (cleanVal === 'true') params[k] = true;
                                else if (cleanVal === 'false') params[k] = false;
                                else if (cleanVal.startsWith('#') || isNaN(parseFloat(cleanVal))) params[k] = cleanVal;
                                else params[k] = parseFloat(cleanVal);
                            }
                        });
                        // Sync UI
                        Object.keys(inputs).forEach(k => {
                           const input = inputs[k];
                           if(!input || k==='saveCsv' || k==='loadCsv' || k==='themeSelector') return;
                           if(input.type === 'checkbox') input.checked = params[k];
                           else if(k === 'baubleProb') input.value = params[k]*100;
                           else if(k === 'len') input.value = params.initialLength;
                           else if(params[k] !== undefined) input.value = params[k];
                        });
                        updateLabels();
                        generateAndDraw();
                    };
                    reader.readAsText(file);
                });
            } else {
                el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', handler);
            }
        });

        inputs.generateBtn.addEventListener('click', generateAndDraw);

        inputs.dlPng.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'xmas-tree.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        inputs.dlSvg.addEventListener('click', () => {
            const blob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'xmas-tree.svg';
            link.href = url;
            link.click();
        });

        updateLabels();
        setTimeout(resizeCanvas, 100);

    </script>
</body>
</html>

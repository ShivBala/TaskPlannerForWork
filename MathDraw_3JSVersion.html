<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Studio v20 - Stability Fix</title>
    <style>
        body { margin: 0; background: #050505; color: #ccc; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 400px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 30px rgba(0,0,0,0.9); }
        .sidebar-tabs { display: flex; border-bottom: 1px solid #222; background: #0a0a0a; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: #666; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab-btn.active { color: #d4af37; border-bottom-color: #d4af37; background: #161616; }
        
        .scroll-area { padding: 20px; overflow-y: auto; flex-grow: 1; display: none; }
        .scroll-area.active { display: block; }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-track { background: #111; }
        .scroll-area::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        h2 { color: #fff; margin: 0 0 5px 0; font-size: 18px; letter-spacing: 1px; }
        .subtitle { color: #d4af37; font-size: 11px; margin-bottom: 20px; text-transform: uppercase; font-weight: bold; letter-spacing: 2px; }
        h3 { color: #888; font-size: 11px; margin: 20px 0 8px 0; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 4px; font-weight: 700; letter-spacing: 0.5px;}

        .control-group { background: #161616; padding: 10px; border-radius: 6px; border: 1px solid #2a2a2a; margin-bottom: 8px; }
        label { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: 500;}
        span.val { color: #d4af37; font-family: monospace; font-size: 11px;}
        
        input[type=range] { width: 100%; accent-color: #d4af37; background: #333; height: 4px; border-radius: 2px; outline: none; cursor: pointer; }
        select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-size: 12px; outline: none; }

        .layer-list { display: flex; flex-direction: column; gap: 8px; }
        .layer-item { background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 4px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .layer-item:hover { background: #222; border-color: #555; }
        .layer-item.selected { background: #2a2200; border-color: #d4af37; }
        .layer-info { flex-grow: 1; }
        .layer-title { font-size: 12px; color: #fff; font-weight: bold; }
        .layer-sub { font-size: 10px; color: #888; }
        .layer-actions { display: flex; gap: 4px; }
        .icon-btn { background: #333; border: none; color: #aaa; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px;}
        .icon-btn:hover { background: #444; color: #fff; }
        .btn-del:hover { background: #522; color: #f88; }
        
        .layer-btn-row { display: flex; gap: 5px; margin-top: 10px; }
        .add-layer-btn { background: #222; border: 1px dashed #444; color: #888; flex: 1; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 11px; transition: 0.2s;}
        .add-layer-btn:hover { border-color: #d4af37; color: #d4af37; background: #2a2200; }
        .dup-layer-btn { background: #222; border: 1px solid #444; color: #ccc; flex: 1; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 11px; transition: 0.2s;}
        .dup-layer-btn:hover { border-color: #fff; background: #333; }

        .sector-wrapper { margin-top: 5px; }
        .sector-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; aspect-ratio: 1; background: #111; border: 1px solid #333; padding: 2px; }
        .sector-cell { background: #222; border: 1px solid #2a2a2a; cursor: pointer; transition: 0.1s; }
        .sector-cell:hover { background: #333; }
        .sector-cell.active { background: #d4af37; border-color: #fff; box-shadow: 0 0 5px #d4af37; }
        .sector-toolbar { display: flex; gap: 5px; margin-top: 8px; }
        .tool-btn { flex: 1; background: #222; border: 1px solid #333; color: #888; font-size: 9px; padding: 4px; cursor: pointer; text-transform: uppercase; }
        .tool-btn:hover { color: #fff; border-color: #555; }

        .preset-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .preset-btn { flex: 1; background: #2a2a2a; border: 1px solid #444; color: #ccc; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 3px; text-align: center; }
        .preset-btn:hover { background: #333; border-color: #d4af37; color: #fff; }
        input[type="file"] { display: none; }

        button.main-action { margin: 20px; padding: 16px; background: linear-gradient(135deg, #d4af37 0%, #8c702a 100%); border: none; color: white; font-weight: 800; cursor: pointer; border-radius: 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; width: 100%; }
        button.main-action:hover { filter: brightness(1.15); }
        button.main-action:disabled { background: #333; color: #555; cursor: wait; }

        #canvas-wrapper { flex-grow: 1; position: relative; background: #080808; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        canvas { box-shadow: 0 0 60px #000; display: block; max-width: 95%; max-height: 95%; border: 1px solid #333; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: #d4af37; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .spinner { border: 4px solid #222; border-top: 4px solid #d4af37; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-tabs">
        <button class="tab-btn active" onclick="switchTab('edit')">Designer</button>
        <button class="tab-btn" onclick="switchTab('layers')">Layers</button>
        <button class="tab-btn" onclick="switchTab('global')">Global</button>
    </div>

    <div id="tab-edit" class="scroll-area active">
        <div class="preset-row">
            <button class="preset-btn" id="btn-project-export">Export Project</button>
            <label class="preset-btn" for="project-upload">Import Project</label>
            <input type="file" id="project-upload" accept=".json">
        </div>

        <div id="no-layer-msg" style="display:none; text-align:center; padding:20px; color:#666;">No layer selected</div>
        <div id="layer-controls">
            
            <h3>Material</h3>
            <div class="control-group">
                <label>Material</label>
                <select id="l_material">
                    <option value="gold">Pure Gold</option>
                    <option value="rose">Rose Gold</option>
                    <option value="silver">Silver</option>
                    <option value="platinum">Platinum</option>
                    <option value="obsidian">Obsidian</option>
                    <option value="porcelain">Porcelain</option>
                </select>
            </div>
            <div class="control-group">
                <label>Roughness <span class="val" id="val-l_roughness"></span></label>
                <input type="range" id="l_roughness" min="0" max="1" step="0.05">
            </div>
            <div class="control-group">
                <label>Metalness <span class="val" id="val-l_metalness"></span></label>
                <input type="range" id="l_metalness" min="0" max="1" step="0.05">
            </div>

            <h3>Layout</h3>
            <div class="control-group">
                <label>Mode</label>
                <select id="l_mode">
                    <option value="grid">Grid / Border</option>
                    <option value="single">Single (Center)</option>
                </select>
            </div>
            
            <div id="sector-control-group">
                <div class="control-group">
                    <label>Placement Grid (6x6)</label>
                    <div class="sector-wrapper">
                        <div class="sector-grid" id="sector-grid-container"></div>
                        <div class="sector-toolbar">
                            <button class="tool-btn" onclick="gridAction('border')">Border</button>
                            <button class="tool-btn" onclick="gridAction('corners')">Corners</button>
                            <button class="tool-btn" onclick="gridAction('all')">Fill</button>
                            <button class="tool-btn" onclick="gridAction('clear')">Clear</button>
                        </div>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>Fill Type</label>
                    <select id="l_fillMode">
                        <option value="continuous">Continuous (Rail)</option>
                        <option value="cell">Cell (Cluster)</option>
                    </select>
                </div>

                <div id="cell-density-controls">
                    <div class="control-group">
                        <label>Cols (X) <span style="font-size:9px; color:#666;">0=Auto</span> <span class="val" id="val-l_cols"></span></label>
                        <input type="range" id="l_cols" min="0" max="6" step="1" value="0">
                    </div>
                    <div class="control-group">
                        <label>Rows (Y) <span style="font-size:9px; color:#666;">0=Auto</span> <span class="val" id="val-l_rows"></span></label>
                        <input type="range" id="l_rows" min="0" max="6" step="1" value="0">
                    </div>
                </div>

                <div class="control-group">
                    <label>Spacing (Gap) <span class="val" id="val-l_spacing"></span></label>
                    <input type="range" id="l_spacing" min="1.0" max="15.0" step="0.5">
                </div>
                <div class="control-group">
                    <label>Margin <span class="val" id="val-l_margin"></span></label>
                    <input type="range" id="l_margin" min="0" max="45.0" step="0.5">
                </div>
            </div>

            <h3>Geometry</h3>
            <div class="control-group">
                <label>Type</label>
                <select id="l_type">
                    <option value="flower">Flower (Radial)</option>
                    <option value="leaf">Leaf (Botanic)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Scale <span class="val" id="val-l_scale"></span></label>
                <input type="range" id="l_scale" min="0.1" max="15.0" step="0.1">
            </div>
            
            <div id="flower-controls">
                <div class="control-group">
                    <label>Petal Shape</label>
                    <select id="l_petalShape">
                        <option value="standard">Standard</option>
                        <option value="convex">Convex</option>
                        <option value="concave">Concave</option>
                        <option value="squared">Squared</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Radial Count <span class="val" id="val-l_k1"></span></label>
                    <input type="range" id="l_k1" min="2" max="16" step="1">
                </div>
                <div class="control-group">
                    <label>Vertical Count <span class="val" id="val-l_k2"></span></label>
                    <input type="range" id="l_k2" min="1" max="16" step="1">
                </div>
                <div class="control-group">
                    <label>Center Radius <span class="val" id="val-l_centerRadius"></span></label>
                    <input type="range" id="l_centerRadius" min="0.0" max="1.5" step="0.05">
                </div>
            </div>

            <div id="leaf-controls" style="display:none;">
                <div class="control-group">
                    <label>Leaf Species</label>
                    <select id="l_leafSpecies">
                        <option value="standard">Standard</option>
                        <option value="lanceolate">Lanceolate (Willow)</option>
                        <option value="cordate">Cordate (Heart)</option>
                        <option value="serrate">Serrate (Rose)</option>
                        <option value="maple">Maple (Lobed)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Leaf Width <span class="val" id="val-l_leafWidth"></span></label>
                    <input type="range" id="l_leafWidth" min="0.2" max="3.0" step="0.1">
                </div>
                <div class="control-group">
                    <label>Bend <span class="val" id="val-l_bend"></span></label>
                    <input type="range" id="l_bend" min="-2.0" max="2.0" step="0.1">
                </div>
                <div class="control-group">
                    <label>Vein Depth <span class="val" id="val-l_vein"></span></label>
                    <input type="range" id="l_vein" min="0.0" max="2.0" step="0.1">
                </div>
            </div>

            <div class="control-group">
                <label>Twist <span class="val" id="val-l_twist"></span></label>
                <input type="range" id="l_twist" min="-3" max="3" step="0.1">
            </div>
            <div class="control-group">
                <label>Sharpness <span class="val" id="val-l_sharp"></span></label>
                <input type="range" id="l_sharp" min="0.2" max="5.0" step="0.1">
            </div>

            <h3>Transform</h3>
            <div class="control-group">
                <label>Rotation X/Y/Z</label>
                <div style="display:flex; gap:5px;">
                    <input type="range" id="l_rotX" min="0" max="360" step="5">
                    <input type="range" id="l_rotY" min="0" max="360" step="5">
                    <input type="range" id="l_rotZ" min="0" max="360" step="5">
                </div>
            </div>
        </div>
    </div>

    <div id="tab-layers" class="scroll-area">
        <h3>Layer Manager</h3>
        <div id="layer-list-container" class="layer-list"></div>
        <div class="layer-btn-row">
            <button class="add-layer-btn" onclick="addLayer()">+ Add New</button>
            <button class="dup-layer-btn" onclick="duplicateLayer()">Duplicate Selected</button>
        </div>
    </div>

    <div id="tab-global" class="scroll-area">
        <h3>Frame Control</h3>
        <div class="control-group">
            <label>Camera Zoom (Fit) <span class="val" id="val-g_camZoom">1.0</span></label>
            <input type="range" id="g_camZoom" min="0.2" max="2.0" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label>Pan X <span class="val" id="val-g_panX">0</span></label>
            <input type="range" id="g_panX" min="-50" max="50" step="1" value="0">
        </div>
        <div class="control-group">
            <label>Pan Y <span class="val" id="val-g_panY">0</span></label>
            <input type="range" id="g_panY" min="-50" max="50" step="1" value="0">
        </div>

        <div class="control-group">
            <label>Exposure <span class="val" id="val-g_exposure">1.5</span></label>
            <input type="range" id="g_exposure" min="0.1" max="4.0" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>Light Rotation <span class="val" id="val-g_lightRot">0</span>°</label>
            <input type="range" id="g_lightRot" min="0" max="360" step="5" value="0">
        </div>
        <div class="control-group">
            <label>Aspect Ratio</label>
            <select id="g_canvasShape">
                <option value="square">Square (1:1)</option>
                <option value="portrait">Portrait (4:5)</option>
                <option value="landscape">Landscape (3:2)</option>
            </select>
        </div>
        <h3>Export</h3>
        <div class="control-group">
            <label>Resolution</label>
            <select id="exportRes">
                <option value="1024">HD (1024px)</option>
                <option value="2048">2K (2048px)</option>
                <option value="4096" selected>4K (4096px)</option>
            </select>
        </div>
        <button id="btn-export" class="main-action">Render Image</button>
    </div>
</div>

<div id="canvas-wrapper">
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div style="font-size: 18px; font-weight: bold;">Rendering...</div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';

    const globalParams = {
        exposure: 1.5, lightRot: 0,
        canvasShape: 'square', exportRes: 4096,
        camZoom: 1.0, panX: 0, panY: 0
    };

    let layers = [
        {
            id: 1, name: 'Golden Flower', type: 'flower', mode: 'single',
            spacing: 6.0, margin: 5.0, scale: 5.0, 
            fillMode: 'cell', cols: 0, rows: 0,
            grid: new Array(36).fill(false), 
            rotX: 45, rotY: 45, rotZ: 0,
            material: 'gold', roughness: 0.15, metalness: 1.0,
            petalShape: 'standard', k1: 6, k2: 5, centerRadius: 0.2, twist: 0.5, sharp: 2.0,
            leafSpecies: 'standard', leafWidth: 1.0, bend: 0.5, vein: 1.0
        }
    ];
    let activeLayerId = 1;
    let nextId = 2;

    const container = document.getElementById('canvas-wrapper');
    const scene = new THREE.Scene();
    
    const WORLD_HEIGHT = 100;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1000);
    camera.position.set(0, 0, 100); camera.lookAt(0,0,0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 2); 
    renderer.setSize(500, 500);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // FRAME GUIDE (Red Box)
    const frameGeometry = new THREE.BufferGeometry();
    const frameMat = new THREE.LineBasicMaterial({ color: 0xff0000, opacity: 0.3, transparent: true });
    const frameLine = new THREE.LineLoop(frameGeometry, frameMat);
    scene.add(frameLine);

    const lightGroup = new THREE.Group(); scene.add(lightGroup);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); lightGroup.add(ambientLight);
    const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
    mainLight.position.set(20, 20, 20); mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048; mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.left = -60; mainLight.shadow.camera.right = 60;
    mainLight.shadow.camera.top = 60; mainLight.shadow.camera.bottom = -60;
    lightGroup.add(mainLight);
    const rimLight = new THREE.DirectionalLight(0xffeedd, 1.5); rimLight.position.set(-20, 10, -20); lightGroup.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0xddddff, 0.8); fillLight.position.set(0, -20, 10); lightGroup.add(fillLight);

    const rootGroup = new THREE.Group(); scene.add(rootGroup);

    function updateFrameGuide() {
        let targetAspect = 1.0;
        if(globalParams.canvasShape === 'portrait') targetAspect = 4/5;
        if(globalParams.canvasShape === 'landscape') targetAspect = 3/2;
        
        const halfH = WORLD_HEIGHT / 2;
        const halfW = (WORLD_HEIGHT * targetAspect) / 2;
        
        const pts = [
            new THREE.Vector3(-halfW, halfH, 0),
            new THREE.Vector3(halfW, halfH, 0),
            new THREE.Vector3(halfW, -halfH, 0),
            new THREE.Vector3(-halfW, -halfH, 0)
        ];
        frameGeometry.setFromPoints(pts);
    }

    function initGridUI() {
        const container = document.getElementById('sector-grid-container');
        container.innerHTML = '';
        for(let i=0; i<36; i++) {
            const cell = document.createElement('div');
            cell.className = 'sector-cell';
            cell.dataset.idx = i;
            cell.onclick = () => toggleGridCell(i);
            container.appendChild(cell);
        }
    }
    
    function toggleGridCell(idx) {
        const l = layers.find(x => x.id === activeLayerId);
        if(!l) return;
        l.grid[idx] = !l.grid[idx];
        bindLayerToUI();
        updateScene();
    }

    window.gridAction = (action) => {
        const l = layers.find(x => x.id === activeLayerId);
        if(!l) return;
        if(action === 'clear') l.grid.fill(false);
        if(action === 'all') l.grid.fill(true);
        if(action === 'border') {
            l.grid.fill(false);
            for(let i=0; i<36; i++) {
                const row = Math.floor(i/6); const col = i%6;
                if(row===0 || row===5 || col===0 || col===5) l.grid[i] = true;
            }
        }
        if(action === 'corners') {
            l.grid.fill(false); l.grid[0]=true; l.grid[5]=true; l.grid[30]=true; l.grid[35]=true;
        }
        bindLayerToUI(); updateScene();
    };

    window.switchTab = (tab) => {
        document.querySelectorAll('.scroll-area').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-'+tab).classList.add('active');
        if(tab==='edit') document.querySelector('button[onclick*="edit"]').classList.add('active');
        if(tab==='layers') document.querySelector('button[onclick*="layers"]').classList.add('active');
        if(tab==='global') document.querySelector('button[onclick*="global"]').classList.add('active');
    };

    window.addLayer = () => {
        layers.push({
            id: nextId, name: `Layer ${nextId}`, type: 'leaf', mode: 'grid',
            spacing: 5.0, margin: 10.0, scale: 3.0, cols: 0, rows: 0, fillMode: 'cell',
            grid: new Array(36).fill(false), 
            rotX: 0, rotY: 0, rotZ: 45,
            material: 'obsidian', roughness: 0.4, metalness: 0.0,
            petalShape: 'standard', k1: 5, k2: 3, centerRadius: 0.1, twist: 0.2, sharp: 2.0,
            leafSpecies: 'standard', leafWidth: 1.0, bend: 0.5, vein: 1.0
        });
        const l = layers[layers.length-1];
        for(let i=0; i<36; i++) { const r=Math.floor(i/6), c=i%6; if(r===0||r===5||c===0||c===5) l.grid[i]=true; }
        activeLayerId = nextId; nextId++;
        renderLayerList(); bindLayerToUI(); updateScene(); switchTab('edit');
    };

    window.duplicateLayer = () => {
        const original = layers.find(l => l.id === activeLayerId);
        if(!original) return;
        const copy = JSON.parse(JSON.stringify(original));
        copy.id = nextId++;
        copy.name = original.name + " (Copy)";
        layers.push(copy);
        activeLayerId = copy.id;
        renderLayerList(); bindLayerToUI(); updateScene(); switchTab('edit');
    };

    window.deleteLayer = (id, e) => {
        e.stopPropagation();
        if(layers.length <= 1) { alert("Cannot delete last layer"); return; }
        layers = layers.filter(l => l.id !== id);
        if(activeLayerId === id) activeLayerId = layers[0].id;
        renderLayerList(); bindLayerToUI(); updateScene();
    };

    window.moveLayer = (id, dir, e) => {
        e.stopPropagation();
        const idx = layers.findIndex(l => l.id === id);
        if(dir === -1 && idx > 0) { [layers[idx], layers[idx-1]] = [layers[idx-1], layers[idx]]; } 
        else if(dir === 1 && idx < layers.length-1) { [layers[idx], layers[idx+1]] = [layers[idx+1], layers[idx]]; }
        renderLayerList(); updateScene();
    };

    window.selectLayer = (id) => {
        activeLayerId = id; renderLayerList(); bindLayerToUI(); switchTab('edit');
    };

    function renderLayerList() {
        const list = document.getElementById('layer-list-container');
        list.innerHTML = '';
        layers.forEach((l, index) => {
            const item = document.createElement('div');
            item.className = `layer-item ${l.id === activeLayerId ? 'selected' : ''}`;
            item.onclick = () => selectLayer(l.id);
            item.innerHTML = `
                <div class="layer-info">
                    <div class="layer-title">${l.name} (Z: ${index*20})</div>
                    <div class="layer-sub">${l.type.toUpperCase()} - ${l.material}</div>
                </div>
                <div class="layer-actions">
                    <button class="icon-btn" onclick="moveLayer(${l.id}, -1, event)">▲</button>
                    <button class="icon-btn" onclick="moveLayer(${l.id}, 1, event)">▼</button>
                    <button class="icon-btn btn-del" onclick="deleteLayer(${l.id}, event)">×</button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    function bindLayerToUI() {
        const l = layers.find(x => x.id === activeLayerId);
        if(!l) return;

        setVal('l_mode', l.mode);
        setVal('l_spacing', l.spacing); setVal('l_margin', l.margin);
        setVal('l_type', l.type); setVal('l_scale', l.scale); 
        setVal('l_fillMode', l.fillMode || 'cell');
        setVal('l_cols', l.cols || 0); setVal('l_rows', l.rows || 0);

        setVal('l_rotX', l.rotX); setVal('l_rotY', l.rotY); setVal('l_rotZ', l.rotZ);
        setVal('l_material', l.material); setVal('l_roughness', l.roughness); setVal('l_metalness', l.metalness);
        setVal('l_petalShape', l.petalShape); setVal('l_k1', l.k1); setVal('l_k2', l.k2);
        setVal('l_centerRadius', l.centerRadius);
        setVal('l_leafSpecies', l.leafSpecies); setVal('l_leafWidth', l.leafWidth);
        setVal('l_bend', l.bend); setVal('l_vein', l.vein);
        setVal('l_twist', l.twist); setVal('l_sharp', l.sharp);

        document.getElementById('flower-controls').style.display = (l.type === 'flower') ? 'block' : 'none';
        document.getElementById('leaf-controls').style.display = (l.type === 'leaf') ? 'block' : 'none';
        document.getElementById('sector-control-group').style.display = (l.mode === 'grid') ? 'block' : 'none';
        document.getElementById('cell-density-controls').style.display = (l.fillMode === 'cell') ? 'block' : 'none';

        const cells = document.querySelectorAll('.sector-cell');
        cells.forEach((cell, i) => {
            if(l.grid[i]) cell.classList.add('active');
            else cell.classList.remove('active');
        });
    }

    function setVal(id, val) {
        const el = document.getElementById(id);
        if(el) {
            el.value = val;
            const lbl = document.getElementById('val-'+id);
            if(lbl) lbl.innerText = val;
        }
    }

    const inputs = document.querySelectorAll('#tab-edit input, #tab-edit select');
    inputs.forEach(input => {
        input.addEventListener('input', (e) => {
            if(e.target.id === 'csv-upload' || e.target.id === 'project-upload') return;
            const l = layers.find(x => x.id === activeLayerId);
            if(!l) return;
            let val = e.target.value;
            if(e.target.type === 'range') val = parseFloat(val);
            
            const prop = e.target.id.replace('l_', '');
            l[prop] = val;
            
            setVal(e.target.id, val);
            if(prop === 'type') {
                l.name = val === 'flower' ? 'Golden Flower' : 'Golden Leaf';
                renderLayerList(); bindLayerToUI();
            }
            if(prop === 'mode' || prop === 'fillMode') bindLayerToUI();
            if(prop === 'material') renderLayerList(); 
            updateScene();
        });
    });

    document.querySelectorAll('#tab-global input, #tab-global select').forEach(input => {
        input.addEventListener('input', (e) => {
            let val = e.target.value;
            if(e.target.type === 'range') val = parseFloat(val);
            const prop = e.target.id.replace('g_', '');
            globalParams[prop] = val;
            const lbl = document.getElementById('val-'+e.target.id);
            if(lbl) lbl.innerText = val;
            if(prop === 'canvasShape' || prop === 'camZoom' || prop === 'panX' || prop === 'panY') handleResize();
            else updateGlobalSettings();
        });
    });

    function updateGlobalSettings() {
        renderer.toneMappingExposure = globalParams.exposure;
        lightGroup.rotation.y = globalParams.lightRot * (Math.PI / 180);
    }

    function createMaterial(l) {
        let color = 0xffffff;
        switch(l.material) {
            case 'gold': color = 0xffd700; break;
            case 'rose': color = 0xffb7a5; break;
            case 'silver': color = 0xf0f0f0; break;
            case 'platinum': color = 0xaaaaaa; break;
            case 'obsidian': color = 0x111111; break;
            case 'porcelain': color = 0xffffff; break;
        }
        return new THREE.MeshStandardMaterial({
            color: color, roughness: l.roughness, metalness: l.metalness, side: THREE.DoubleSide
        });
    }

    function createGeometry(l) {
        // MATH FIX: Ensure defaults exist to prevent NaN
        const stretch = l.stretch || 1.0;
        const bend = l.bend || 0.0;
        const veinStrength = l.vein || 0.0;
        const leafWidth = l.leafWidth || 1.0;
        
        const stacks = 200; const slices = 200;
        const geometry = new THREE.BufferGeometry();
        const positions = []; const indices = [];

        for (let i = 0; i <= stacks; i++) {
            let v = i / stacks; let phi = Math.PI * v; 
            for (let j = 0; j <= slices; j++) {
                let u = j / slices; let theta = 2 * Math.PI * u; 
                let r = 0, x=0, y=0, z=0;

                if (l.type === 'flower') {
                    let effectiveTheta = theta + l.twist * phi;
                    let baseShape = Math.sin(l.k1 * effectiveTheta) * Math.cos(l.k2 * phi);
                    let shape = Math.pow(Math.abs(baseShape), l.sharp);
                    if (l.petalShape === 'convex') shape = Math.pow(Math.abs(baseShape), l.sharp * 0.5);
                    else if (l.petalShape === 'concave') shape = Math.pow(Math.abs(baseShape), l.sharp * 1.5);
                    else if (l.petalShape === 'squared') shape = Math.pow(Math.abs(baseShape), 0.1) * Math.pow(Math.abs(baseShape), l.sharp);

                    let dampener = Math.pow(Math.sin(phi), 2.5);
                    r = l.centerRadius + 1.5 * shape * dampener; 
                    x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.cos(phi); z = r * Math.sin(phi) * Math.sin(theta);

                } else {
                    // LEAF LOGIC
                    let effectiveTheta = theta;
                    let baseShape = Math.sin(effectiveTheta + Math.PI/2);
                    if (l.leafSpecies === 'lanceolate') baseShape = Math.sin(effectiveTheta + Math.PI/2); 
                    else if (l.leafSpecies === 'cordate') baseShape = Math.sin(effectiveTheta + Math.PI/2) + 0.3*Math.cos(2*effectiveTheta);
                    else if (l.leafSpecies === 'serrate') baseShape += 0.1 * Math.sin(20 * effectiveTheta);
                    else if (l.leafSpecies === 'maple') baseShape += 0.4 * Math.cos(3 * effectiveTheta);

                    let shape = Math.pow(Math.abs(baseShape), l.sharp); 
                    let vein = 1.0 - veinStrength * 0.1 * Math.abs(Math.sin(10 * theta)); 
                    let dampener = Math.pow(Math.sin(phi), 2.0);
                    r = (0.05 + leafWidth * shape * dampener) * vein;

                    x = r * Math.sin(phi) * Math.cos(theta) * (1/stretch); 
                    y = r * Math.cos(phi) * 3.0; 
                    z = r * Math.sin(phi) * Math.sin(theta);
                    z += bend * Math.pow(y/3.0, 2);
                }
                
                // NaN GUARD
                if(isNaN(x) || isNaN(y) || isNaN(z)) { x=0; y=0; z=0; }
                
                positions.push(x, y, z);
            }
        }
        for (let i = 0; i < stacks; i++) {
            for (let j = 0; j < slices; j++) {
                let a = i * (slices + 1) + j; let b = i * (slices + 1) + j + 1;
                let c = (i + 1) * (slices + 1) + j; let d = (i + 1) * (slices + 1) + j + 1;
                indices.push(a, c, b); indices.push(b, c, d);
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals(); 
        return geometry;
    }

    function updateScene() {
        while(rootGroup.children.length > 0) rootGroup.remove(rootGroup.children[0]);

        let targetAspect = 1.0;
        if(globalParams.canvasShape === 'portrait') targetAspect = 4/5;
        if(globalParams.canvasShape === 'landscape') targetAspect = 3/2;
        
        const h = WORLD_HEIGHT;
        const w = WORLD_HEIGHT * targetAspect;
        
        updateFrameGuide(); 

        layers.forEach((l, index) => {
            const geom = createGeometry(l);
            const mat = createMaterial(l);
            const zLayerOffset = index * 20; 
            const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
                l.rotX * (Math.PI/180), l.rotY * (Math.PI/180), l.rotZ * (Math.PI/180)
            ));

            if(l.mode === 'single') {
                const mesh = new THREE.Mesh(geom, mat);
                mesh.scale.setScalar(l.scale * 5); 
                mesh.position.z = zLayerOffset; 
                mesh.setRotationFromQuaternion(q);
                mesh.castShadow = true; mesh.receiveShadow = true;
                rootGroup.add(mesh);
            } else {
                const margin = l.margin; const spacing = l.spacing; const scale = l.scale;
                const startX = -(w/2) + margin; const startY = (h/2) - margin;
                const usableW = w - (margin*2); const usableH = h - (margin*2);
                const cellW = usableW / 6; const cellH = usableH / 6;

                if (l.fillMode === 'continuous') {
                    const drawnCorners = {};

                    [0, 5].forEach(row => {
                        const rowIndices = [];
                        for(let c=0; c<6; c++) rowIndices.push(row*6 + c);
                        let segments = [], currentSeg = null;
                        rowIndices.forEach((idx, colIndex) => {
                            if(l.grid[idx]) {
                                if(!currentSeg) currentSeg = { start: colIndex, end: colIndex, indices: [idx] };
                                else { currentSeg.end = colIndex; currentSeg.indices.push(idx); }
                            } else {
                                if(currentSeg) { segments.push(currentSeg); currentSeg = null; }
                            }
                        });
                        if(currentSeg) segments.push(currentSeg);

                        segments.forEach(seg => {
                            const railStartX = startX + (seg.start * cellW) + (cellW/2);
                            const railEndX = startX + (seg.end * cellW) + (cellW/2);
                            const y = startY - (row * cellH) - (cellH/2);
                            
                            const dist = railEndX - railStartX;
                            const count = dist === 0 ? 1 : Math.max(1, Math.round(dist / spacing));
                            
                            seg.indices.forEach(idx => {
                                if([0,5,30,35].includes(idx)) drawnCorners[idx] = true;
                            });

                            for(let i=0; i<=count; i++) {
                                if(dist===0 && i>0) continue;
                                const t = count === 0 ? 0 : i/count;
                                const x = railStartX + t * dist;
                                const mesh = new THREE.Mesh(geom, mat);
                                mesh.position.set(x, y, zLayerOffset);
                                mesh.scale.setScalar(scale);
                                mesh.setRotationFromQuaternion(q);
                                mesh.castShadow = true; mesh.receiveShadow = true;
                                rootGroup.add(mesh);
                            }
                        });
                    });

                    [0, 5].forEach(col => {
                        const colIndices = [];
                        for(let r=0; r<6; r++) colIndices.push(r*6 + col);
                        let segments = [], currentSeg = null;
                        colIndices.forEach((idx, rowIndex) => {
                            if(l.grid[idx]) {
                                if(!currentSeg) currentSeg = { start: rowIndex, end: rowIndex, indices: [idx] };
                                else { currentSeg.end = rowIndex; currentSeg.indices.push(idx); }
                            } else {
                                if(currentSeg) { segments.push(currentSeg); currentSeg = null; }
                            }
                        });
                        if(currentSeg) segments.push(currentSeg);

                        segments.forEach(seg => {
                            const railStartY = startY - (seg.start * cellH) - (cellH/2);
                            const railEndY = startY - (seg.end * cellH) - (cellH/2);
                            const x = startX + (col * cellW) + (cellW/2);
                            const dist = Math.abs(railEndY - railStartY);
                            const count = dist === 0 ? 1 : Math.max(1, Math.round(dist / spacing));

                            for(let i=0; i<=count; i++) {
                                if(dist===0 && i>0) continue;
                                let isStart = (i===0); let isEnd = (i===count);
                                if (isStart) { const cellIdx = colIndices[seg.start]; if (drawnCorners[cellIdx]) continue; }
                                if (isEnd && count > 0) { const cellIdx = colIndices[seg.end]; if (drawnCorners[cellIdx]) continue; }

                                const t = count === 0 ? 0 : i/count;
                                const y = railStartY - t * dist;
                                const mesh = new THREE.Mesh(geom, mat);
                                mesh.position.set(x, y, zLayerOffset);
                                mesh.scale.setScalar(scale);
                                mesh.setRotationFromQuaternion(q);
                                mesh.castShadow = true; mesh.receiveShadow = true;
                                rootGroup.add(mesh);
                            }
                        });
                    });

                } else {
                    for(let i=0; i<36; i++) {
                        if(!l.grid[i]) continue; 
                        const row = Math.floor(i/6); const col = i%6;
                        const cellLeft = startX + (col * cellW);
                        const cellTop = startY - (row * cellH);
                        let fitX, fitY;
                        if (l.cols > 0) fitX = l.cols; else fitX = Math.max(1, Math.floor(cellW / spacing));
                        if (l.rows > 0) fitY = l.rows; else fitY = Math.max(1, Math.floor(cellH / spacing));
                        for(let fy=0; fy<fitY; fy++) {
                            for(let fx=0; fx<fitX; fx++) {
                                const posX = cellLeft + (cellW - (fitX-1)*spacing)/2 + fx*spacing;
                                const posY = cellTop - (cellH - (fitY-1)*spacing)/2 - fy*spacing;
                                const mesh = new THREE.Mesh(geom, mat);
                                mesh.position.set(posX, posY, zLayerOffset);
                                mesh.scale.setScalar(scale);
                                mesh.setRotationFromQuaternion(q);
                                mesh.castShadow = true; mesh.receiveShadow = true;
                                rootGroup.add(mesh);
                            }
                        }
                    }
                }
            }
        });
    }

    function updateCamera(width, height) {
        const aspect = width / height;
        const zoomSize = WORLD_HEIGHT / globalParams.camZoom;
        
        const cx = globalParams.panX;
        const cy = globalParams.panY;

        camera.left = cx - (zoomSize * aspect / 2); 
        camera.right = cx + (zoomSize * aspect / 2);
        camera.top = cy + (zoomSize / 2); 
        camera.bottom = cy - (zoomSize / 2);
        camera.updateProjectionMatrix();
    }

    function handleResize() {
        let targetAspect = 1.0;
        if(globalParams.canvasShape === 'portrait') targetAspect = 4/5;
        if(globalParams.canvasShape === 'landscape') targetAspect = 3/2;

        const wrapW = container.clientWidth; const wrapH = container.clientHeight;
        const screenAspect = wrapW / wrapH;
        let finalW, finalH;
        if(screenAspect > targetAspect) { finalH = wrapH - 40; finalW = finalH * targetAspect; } 
        else { finalW = wrapW - 40; finalH = finalW / targetAspect; }

        renderer.setSize(finalW, finalH);
        updateCamera(finalW, finalH);
        updateScene();
    }
    window.addEventListener('resize', handleResize);
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    
    initGridUI();
    renderLayerList(); bindLayerToUI(); updateGlobalSettings(); handleResize(); animate();

    document.getElementById('btn-project-export').addEventListener('click', () => {
        const exportData = { global: globalParams, layers: layers };
        const json = JSON.stringify(exportData, null, 2);
        const blob = new Blob([json], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'golden_v20_project.json'; a.click();
    });

    document.getElementById('project-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = JSON.parse(evt.target.result);
                if(data.global && data.layers) {
                    Object.assign(globalParams, data.global);
                    // Layer Sanitization: ensure all fields exist to prevent NaN
                    layers = data.layers.map(l => ({
                        ...l,
                        stretch: l.stretch || 1.0, bend: l.bend || 0.0, vein: l.vein || 0.0,
                        leafWidth: l.leafWidth || 1.0,
                        grid: l.grid || new Array(36).fill(false),
                        cols: l.cols || 0, rows: l.rows || 0, fillMode: l.fillMode || 'cell'
                    }));
                    nextId = layers.length > 0 ? Math.max(...layers.map(l=>l.id)) + 1 : 1;
                    activeLayerId = layers[0].id;
                    if(globalParams.camZoom === undefined) globalParams.camZoom = 1.0;
                    if(globalParams.panX === undefined) globalParams.panX = 0;
                    if(globalParams.panY === undefined) globalParams.panY = 0;
                    renderLayerList(); bindLayerToUI(); updateGlobalSettings(); handleResize(); updateScene();
                }
            } catch(e) { alert("Invalid Project File"); console.error(e); }
        };
        reader.readAsText(file);
        e.target.value = ''; 
    });

    document.getElementById('btn-export').addEventListener('click', () => {
        const btn = document.getElementById('btn-export');
        const overlay = document.getElementById('loading');
        btn.disabled = true; overlay.style.display = 'flex';
        const res = parseInt(document.getElementById('exportRes').value);
        let w = res; let h = res;
        if(globalParams.canvasShape === 'portrait') h = w * 1.25;
        if(globalParams.canvasShape === 'landscape') h = w * 0.666;
        const prevSize = new THREE.Vector2(); renderer.getSize(prevSize);
        const prevPixelRatio = renderer.getPixelRatio();
        
        frameLine.visible = false; // Hide red box
        updateCamera(w, h); 
        renderer.setSize(w, h); 
        renderer.setPixelRatio(2);
        updateScene(); 
        
        setTimeout(() => {
            renderer.render(scene, camera);
            renderer.domElement.toBlob((blob) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = `Golden_Stable_${w}px.png`; a.click();
                frameLine.visible = true;
                updateCamera(prevSize.x, prevSize.y); 
                renderer.setSize(prevSize.x, prevSize.y); 
                renderer.setPixelRatio(prevPixelRatio);
                updateScene(); 
                overlay.style.display = 'none'; btn.disabled = false;
            });
        }, 500);
    });
</script>
</body>

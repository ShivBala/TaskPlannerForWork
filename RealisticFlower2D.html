<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Zinnia Center</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        canvas { display: block; }
        
        #controls {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85); color: white;
            padding: 20px; border-radius: 8px;
            width: 260px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #444;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { width: 100%; accent-color: #00bcd4; cursor: pointer; }
        select, input[type="color"] { width: 100%; padding: 6px; border: 1px solid #444; background: #333; color: white; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>Flower Type</label>
            <select id="typeSelect">
                <option value="daisy">Daisy</option>
                <option value="zinnia" selected>Zinnia</option>
            </select>
        </div>
        <div class="control-group">
            <label>Petal Color</label>
            <input type="color" id="colorPicker" value="#ff4081">
        </div>
        <div class="control-group">
            <label>Petal Count</label>
            <input type="range" id="petalCount" min="20" max="150" value="80">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const params = {
            type: 'zinnia', // Default to Zinnia to show fix
            color: '#ff4081',
            count: 80,
            scale: 1.0
        };

        let cx, cy;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            draw();
        }
        window.addEventListener('resize', resize);

        // Event Listeners
        document.getElementById('typeSelect').addEventListener('change', (e) => { 
            params.type = e.target.value; 
            if(params.type === 'daisy') {
                params.count = 25; 
                document.getElementById('petalCount').value = 25;
                params.color = '#ffffff';
                document.getElementById('colorPicker').value = '#ffffff';
            } else {
                params.count = 80;
                document.getElementById('petalCount').value = 80;
                params.color = '#ff4081';
                document.getElementById('colorPicker').value = '#ff4081';
            }
            draw(); 
        });
        document.getElementById('colorPicker').addEventListener('input', (e) => { params.color = e.target.value; draw(); });
        document.getElementById('petalCount').addEventListener('input', (e) => { params.count = parseInt(e.target.value); draw(); });

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
            R = (R<255)?R:(R>0?255:0); G = (G<255)?G:(G>0?255:0); B = (B<255)?B:(B>0?255:0);
            return "#" + (1<<24|R<<16|G<<8|B).toString(16).slice(1);
        }

        function drawPetal(ctx, w, h, color, type) {
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, shadeColor(color, 20)); 
            grad.addColorStop(0.6, color);
            grad.addColorStop(1, shadeColor(color, -30));

            ctx.fillStyle = grad;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            ctx.beginPath();
            ctx.moveTo(0, 0);

            if (type === 'daisy') {
                ctx.bezierCurveTo(w/2, h*0.2, w, h*0.8, 0, h);
                ctx.bezierCurveTo(-w, h*0.8, -w/2, h*0.2, 0, 0);
            } else {
                // Zinnia: Slightly sharper, wider at middle
                ctx.bezierCurveTo(w*1.1, h*0.4, w*0.9, h*0.95, 0, h);
                ctx.bezierCurveTo(-w*0.9, h*0.95, -w*1.1, h*0.4, 0, 0);
            }
            ctx.fill();
            
            if(type === 'daisy') {
                ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, h*0.9); ctx.stroke();
            }
        }

        // --- DAISY LOGIC ---
        function drawDaisy() {
            const radius = 45; 
            for (let i = 0; i < params.count; i++) {
                const angle = (Math.PI * 2 * i) / params.count;
                const lenVar = (i % 2 === 0) ? 1.0 : 0.97; 
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle); ctx.translate(0, radius);
                drawPetal(ctx, 22, 130 * lenVar, params.color, 'daisy');
                ctx.restore();
            }
            drawDisk(50, '#ffcc00', '#f57f17'); // Yellow center for daisy
        }

        // --- ZINNIA LOGIC (Fixed) ---
        function drawZinnia() {
            const goldenAngle = 137.5 * (Math.PI / 180);
            const spread = 11;
            
            // FIX 1: Loop down closer to 0 to tighten the center space.
            // We stop at i > 3. The smaller 'i' is, the closer the petal is to the center.
            for (let i = params.count; i > 3; i--) {
                const r = Math.sqrt(i) * spread;
                const theta = i * goldenAngle;
                
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                
                // Scale petals down as they get closer to center
                const scale = (i / params.count) * 0.6 + 0.4;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.translate(x, y);
                ctx.rotate(theta - Math.PI/2);
                
                // Inner petals are darker
                const pColor = shadeColor(params.color, (scale * 30) - 15);
                
                drawPetal(ctx, 32 * scale, 75 * scale, pColor, 'zinnia');
                ctx.restore();
            }

            // FIX 2: Dark Blue Center, size reduced to fit tight spiral
            drawDisk(15, '#1a237e', '#000051'); 
            
            // Add tiny florets on top
            ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = "#3949ab";
            for(let k=0; k<12; k++) {
                let ang = k * (Math.PI*2/12) + (k%2?0.2:0); // slight offset
                let dist = (k%2) ? 6 : 10;
                ctx.beginPath(); ctx.arc(Math.cos(ang)*dist, Math.sin(ang)*dist, 1.5, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function drawDisk(size, color1, color2) {
            ctx.save();
            ctx.translate(cx, cy);
            const grad = ctx.createRadialGradient(0,0, size*0.1, 0,0, size);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawLeaves() {
            for(let i=0; i<8; i++) {
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(i * (Math.PI*2/8) + 0.3);
                ctx.translate(0, 50); // Tighter leaves for zinnia look
                ctx.fillStyle = "#2e7d32"; ctx.shadowBlur=15; ctx.shadowColor="black";
                ctx.beginPath(); ctx.moveTo(0,0); 
                ctx.bezierCurveTo(35,50, 25,120, 0,140); ctx.bezierCurveTo(-25,120, -35,50, 0,0); 
                ctx.fill(); ctx.restore();
            }
        }

        function draw() {
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 600);
            bgGrad.addColorStop(0, '#222'); bgGrad.addColorStop(1, '#111');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawLeaves();

            if (params.type === 'daisy') {
                drawDaisy();
            } else {
                drawZinnia();
            }
        }

        resize();

    </script>
</body>
</html>

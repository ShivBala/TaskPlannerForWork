<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Realistic Flowers</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        canvas { display: block; }
        
        #controls {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.8); color: white;
            padding: 20px; border-radius: 8px;
            width: 250px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #ccc; }
        input[type="range"] { width: 100%; }
        select, input[type="color"] { width: 100%; padding: 5px; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="controls">
        <div class="control-group">
            <label>Flower Type</label>
            <select id="typeSelect">
                <option value="rose">Rose</option>
                <option value="daisy">Daisy</option>
                <option value="lotus">Lotus</option>
                <option value="lily">Lily</option>
                <option value="cosmos">Cosmos</option>
            </select>
        </div>
        <div class="control-group">
            <label>Petal Color</label>
            <input type="color" id="colorPicker" value="#e60042">
        </div>
        <div class="control-group">
            <label>Petal Count (Density)</label>
            <input type="range" id="petalCount" min="5" max="60" value="30">
        </div>
        <div class="control-group">
            <label>Size</label>
            <input type="range" id="sizeScale" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // State
        const params = {
            type: 'rose',
            color: '#e60042',
            count: 30,
            scale: 1.0,
            rotation: 0
        };

        // Resize handling
        let cx, cy;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            draw();
        }
        window.addEventListener('resize', resize);

        // Inputs
        document.getElementById('typeSelect').addEventListener('change', (e) => { params.type = e.target.value; draw(); });
        document.getElementById('colorPicker').addEventListener('input', (e) => { params.color = e.target.value; draw(); });
        document.getElementById('petalCount').addEventListener('input', (e) => { params.count = parseInt(e.target.value); draw(); });
        document.getElementById('sizeScale').addEventListener('input', (e) => { params.scale = parseFloat(e.target.value); draw(); });

        // Helper: Lighten/Darken Hex color
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16);
            let G = parseInt(color.substring(3,5),16);
            let B = parseInt(color.substring(5,7),16);

            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);

            R = (R<255)?R:255;  
            G = (G<255)?G:255;  
            B = (B<255)?B:255;  

            let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
            let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
            let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

            return "#"+RR+GG+BB;
        }

        // --- DRAWING PRIMITIVES ---

        // Draws a single petal shape with a gradient to fake 3D volume
        function drawPetalShape(ctx, width, length, color, type = 'standard') {
            const grad = ctx.createLinearGradient(0, 0, 0, length);
            
            // Gradient Logic: Darker at base (0), Lighter at tip (length)
            const dark = shadeColor(color, -40);
            const mid = color;
            const light = shadeColor(color, 40);

            grad.addColorStop(0, dark);
            grad.addColorStop(0.4, mid);
            grad.addColorStop(1, light);
            
            ctx.fillStyle = grad;
            // Fake ambient occlusion shadow on edges
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 2;

            ctx.beginPath();
            ctx.moveTo(0, 0);

            if (type === 'standard') {
                // Classic rounded petal
                ctx.bezierCurveTo(width, length * 0.3, width, length * 0.7, 0, length);
                ctx.bezierCurveTo(-width, length * 0.7, -width, length * 0.3, 0, 0);
            } else if (type === 'pointed') {
                // Lotus/Lily style
                ctx.quadraticCurveTo(width, length * 0.4, 0, length);
                ctx.quadraticCurveTo(-width, length * 0.4, 0, 0);
            } else if (type === 'jagged') {
                // Cosmos style
                ctx.lineTo(width/2, length*0.2);
                ctx.lineTo(width, length);
                // Jagged tip
                ctx.lineTo(width/3, length*0.9);
                ctx.lineTo(0, length);
                ctx.lineTo(-width/3, length*0.9);
                ctx.lineTo(-width, length);
                ctx.lineTo(-width/2, length*0.2);
            } else if (type === 'rose') {
                // Wide, heart-like for rose
                ctx.bezierCurveTo(width * 1.5, length * 0.2, width, length, 0, length * 0.9);
                ctx.bezierCurveTo(-width, length, -width * 1.5, length * 0.2, 0, 0);
            }

            ctx.fill();
        }

        function drawLeaf(angle, dist, scale) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.translate(0, dist);
            ctx.scale(scale, scale);
            
            // Leaf Gradient
            const grad = ctx.createLinearGradient(0, 0, 0, 150);
            grad.addColorStop(0, '#0f3d0f');
            grad.addColorStop(1, '#4caf50');
            ctx.fillStyle = grad;
            
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'black';

            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(40, 50, 40, 100, 0, 150);
            ctx.bezierCurveTo(-40, 100, -40, 50, 0, 0);
            ctx.fill();

            // Vein
            ctx.strokeStyle = "rgba(0,0,0,0.2)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(0,140);
            ctx.stroke();

            ctx.restore();
        }

        // --- SPECIFIC FLOWERS ---

        function drawDaisy() {
            const pCount = Math.max(8, params.count); // Minimum limits
            const pLength = 120 * params.scale;
            const pWidth = 30 * params.scale;

            for (let i = 0; i < pCount; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.PI * 2 / pCount) * i + params.rotation);
                // Push petal out slightly from center
                ctx.translate(0, 20 * params.scale); 
                drawPetalShape(ctx, pWidth, pLength, params.color, 'standard');
                ctx.restore();
            }

            // Center Disk
            ctx.save();
            ctx.translate(cx, cy);
            const radGrad = ctx.createRadialGradient(0,0, 5 * params.scale, 0,0, 30 * params.scale);
            radGrad.addColorStop(0, '#ffe066');
            radGrad.addColorStop(1, '#cc8800');
            ctx.fillStyle = radGrad;
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(0, 0, 30 * params.scale, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawRose() {
            // Painters algorithm: Draw OUTSIDE (large) petals first, inside (small) last
            // But visually for 2D top-down, we simulate depth by overlapping.
            // Rose math: Golden Angle 137.5 degrees
            const goldenAngle = 137.5 * (Math.PI / 180);
            
            // We iterate backward to draw outer petals first if we want them behind
            // BUT for a rose "cup", usually inner petals are on top.
            
            // Let's draw outer to inner (large to small)
            const maxRadius = 100 * params.scale;
            
            // We need to loop "backwards" visually, meaning start with largest radius
            for (let i = params.count; i > 0; i--) {
                const angle = i * goldenAngle + params.rotation;
                const dist = Math.sqrt(i) * (15 * params.scale); // Spiral spacing
                const scale = (i / params.count) * 0.5 + 0.5; // Inner are smaller

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.translate(0, dist); 
                
                // Rose petals are wider
                // We darken inner petals slightly to simulate the tight bud shadow
                const darkenFactor = (1 - (i/params.count)) * -30;
                const pColor = shadeColor(params.color, darkenFactor);
                
                drawPetalShape(ctx, 40 * params.scale * scale, 50 * params.scale * scale, pColor, 'rose');
                ctx.restore();
            }
        }

        function drawLotus() {
            // Lotus has tiered layers.
            const layers = 3;
            const petalsPerLayer = Math.floor(params.count / layers);
            
            for(let L = 0; L < layers; L++) {
                // Outer layers (L=0) are darker and larger
                // Inner layers (L=2) are brighter and smaller
                const layerScale = 1.0 - (L * 0.2); 
                const layerColor = shadeColor(params.color, L * 15);
                
                for(let i=0; i<petalsPerLayer; i++) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    // Offset angle for each layer so they interleave
                    const angleOffset = (L % 2 === 0) ? 0 : (Math.PI / petalsPerLayer);
                    const angle = (Math.PI * 2 / petalsPerLayer) * i + angleOffset + params.rotation;
                    
                    ctx.rotate(angle);
                    ctx.translate(0, 20 * params.scale); 
                    
                    drawPetalShape(ctx, 40 * params.scale * layerScale, 130 * params.scale * layerScale, layerColor, 'pointed');
                    ctx.restore();
                }
            }
            
            // Center Pod
            ctx.save();
            ctx.translate(cx, cy);
            ctx.fillStyle = '#aadd33';
            ctx.beginPath();
            ctx.arc(0,0, 15 * params.scale, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }

        function drawLily() {
            // 6 Petals standard, but we use slider. Star shape.
            const pCount = (params.count > 10) ? 6 : params.count; // Lilies usually have 6
            
            for (let i = 0; i < pCount; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.PI * 2 / pCount) * i + params.rotation);
                
                // Lilies have stripes usually, we simulate with a thin gradient
                drawPetalShape(ctx, 35 * params.scale, 140 * params.scale, params.color, 'pointed');
                
                // Draw the central vein/stripe specific to lilies
                ctx.beginPath();
                ctx.moveTo(0, 20);
                ctx.lineTo(0, 120 * params.scale);
                ctx.strokeStyle = "rgba(0,0,0,0.3)";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }

            // Stamens
            for(let i=0; i<6; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.PI * 2 / 6) * i + params.rotation + 0.5);
                ctx.fillStyle = '#5c3a21';
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.fillRect(-2, 30*params.scale, 4, 15*params.scale); // Anther
                ctx.restore();
            }
        }

        function drawCosmos() {
            const pCount = Math.max(8, params.count);
            
            for (let i = 0; i < pCount; i++) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.PI * 2 / pCount) * i + params.rotation);
                ctx.translate(0, 15 * params.scale);
                
                drawPetalShape(ctx, 35 * params.scale, 110 * params.scale, params.color, 'jagged');
                
                // Cosmos often have longitudinal grooves
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(-10, 80); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(10, 80); ctx.stroke();

                ctx.restore();
            }

            // Yellow pollen center
            ctx.save();
            ctx.translate(cx, cy);
            ctx.fillStyle = '#ffcc00';
            ctx.shadowBlur = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 15 * params.scale, 0, Math.PI*2);
            ctx.fill();
            // Stippling for pollen texture
            ctx.fillStyle = '#cc9900';
            for(let k=0; k<10; k++){
                let rx = (Math.random()-0.5)*20*params.scale;
                let ry = (Math.random()-0.5)*20*params.scale;
                ctx.beginPath(); ctx.arc(rx, ry, 2, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        // --- MAIN LOOP ---

        function draw() {
            // Clear Background
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Background Leaves first (Greenery)
            const numLeaves = 5;
            for(let i=0; i<numLeaves; i++) {
                drawLeaf((Math.PI*2/numLeaves)*i + params.rotation + 0.5, 40*params.scale, params.scale);
            }

            // Draw Selected Flower
            switch (params.type) {
                case 'rose': drawRose(); break;
                case 'daisy': drawDaisy(); break;
                case 'lotus': drawLotus(); break;
                case 'lily': drawLily(); break;
                case 'cosmos': drawCosmos(); break;
            }
        }

        // Animation Loop for subtle rotation
        function animate() {
            params.rotation += 0.002;
            draw();
            requestAnimationFrame(animate);
        }

        // Init
        resize();
        animate();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Metal Studio v17 - Dual Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background: #151515; font-family: 'Segoe UI', sans-serif; }
        
        #ui-container {
            position: absolute; top: 0; left: 0; width: 360px; height: 100vh;
            background: rgba(10, 10, 10, 0.98); padding: 0;
            box-shadow: 5px 0 40px rgba(0,0,0,1.0);
            border-right: 1px solid #333; overflow-y: auto; color: #ccc;
            scrollbar-width: thin; scrollbar-color: #444 #111;
        }

        /* TABS */
        .tabs { display: flex; background: #111; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
        .tab-btn {
            flex: 1; padding: 15px 0; background: #111; border: none; color: #666;
            font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent;
            font-size: 0.75rem; text-transform: uppercase; transition: 0.2s;
        }
        .tab-btn:hover { color: #fff; background: #1a1a1a; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid #00bfff; background: #1a1a1a; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        /* CONTROLS */
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 5px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], select { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 0.9rem; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00bfff; margin-top: 5px; height: 4px; background: #333; border-radius: 2px; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 30px; padding: 0; cursor: pointer; background: none; }
        
        .section-title { color: #00bfff; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin: 25px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .light-panel { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; border: 1px solid #333; }

        .btn-row { display: flex; gap: 10px; padding: 20px; background: #080808; border-top: 1px solid #333; position: sticky; bottom: 0; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #000; font-size: 0.8rem; text-transform: uppercase; }
        #btn-png { background: #00bfff; color: white; } 
        #btn-video { background: #ff4444; color: white; }
        #btn-video.recording { background: #fff; color: #f00; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        #textureCanvas { display: none; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@800&family=Noto+Sans+Malayalam:wght@800&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="textureCanvas"></canvas>

    <div id="ui-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-eng')">Layer 1 (ENG)</button>
            <button class="tab-btn" onclick="switchTab('tab-mal')">Layer 2 (MAL)</button>
            <button class="tab-btn" onclick="switchTab('tab-anim')">Animation</button>
        </div>

        <div id="tab-eng" class="tab-content active">
            <div class="control-group">
                <label>Text</label>
                <input type="text" id="engText" value="English">
            </div>
            <div class="control-group">
                <label>Size</label>
                <input type="range" id="engSize" min="20" max="200" value="80">
            </div>
            
            <div class="section-title">Material</div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="engColor" value="#ffd700">
            </div>
            <div class="control-group">
                <label>Roughness</label>
                <input type="range" id="engRough" min="0" max="1" step="0.01" value="0.15">
            </div>
            <div class="control-group">
                <label>Metalness</label>
                <input type="range" id="engMetal" min="0" max="1" step="0.01" value="1.0">
            </div>

            <div class="section-title">Studio Lighting</div>
            <div class="light-panel">
                <div class="control-group">
                    <label>Environment Brightness (Reflections)</label>
                    <input type="range" id="engEnvInt" min="0" max="5" step="0.1" value="1.5">
                </div>
                <div class="control-group">
                    <label>Key Light (Main)</label>
                    <input type="range" id="engKeyInt" min="0" max="10" step="0.1" value="3.0">
                </div>
                <div class="control-group">
                    <label>Rim Light (Edge Highlight)</label>
                    <input type="range" id="engRimInt" min="0" max="20" step="0.5" value="8.0">
                </div>
                <div class="control-group">
                    <label>Light Angle X</label>
                    <input type="range" id="engLightX" min="-300" max="300" value="80">
                </div>
                <div class="control-group">
                    <label>Light Angle Y</label>
                    <input type="range" id="engLightY" min="-300" max="300" value="50">
                </div>
            </div>
        </div>

        <div id="tab-mal" class="tab-content">
            <div class="control-group">
                <label>Text</label>
                <input type="text" id="malText" value="കേരളം">
            </div>
            <div class="control-group">
                <label>Size</label>
                <input type="range" id="malSize" min="10" max="200" value="60">
            </div>

            <div class="section-title">Material</div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="malColor" value="#ffd700">
            </div>
            <div class="control-group">
                <label>Roughness</label>
                <input type="range" id="malRough" min="0" max="1" step="0.01" value="0.3">
            </div>
            <div class="control-group">
                <label>Metalness</label>
                <input type="range" id="malMetal" min="0" max="1" step="0.01" value="1.0">
            </div>

            <div class="section-title">Simple Lighting</div>
            <div class="light-panel">
                <div class="control-group">
                    <label>Brightness</label>
                    <input type="range" id="malLightInt" min="0" max="10" step="0.1" value="4.0">
                </div>
                <div class="control-group">
                    <label>Light Position X</label>
                    <input type="range" id="malLightX" min="-200" max="200" value="-50">
                </div>
            </div>
        </div>

        <div id="tab-anim" class="tab-content">
            <div class="control-group">
                <label>Vertical Spacing</label>
                <input type="range" id="textGap" min="-100" max="200" value="40">
            </div>
            <div class="control-group">
                <label>Wire Thickness</label>
                <input type="range" id="wireThick" min="0.5" max="5" step="0.1" value="1.2">
            </div>
            
            <div class="section-title">Animation Controls</div>
            <div class="control-group">
                <label>Effect</label>
                <select id="animType">
                    <option value="write">Write Itself (Growth)</option>
                    <option value="fade">Fade In / Out</option>
                    <option value="rotate">360° Spin</option>
                    <option value="float">Hovering</option>
                </select>
            </div>
            <div class="control-group">
                <label>Speed</label>
                <input type="range" id="animSpeed" min="0.1" max="5" step="0.1" value="1.0">
            </div>
        </div>

        <div class="btn-row">
            <button id="btn-png">Save PNG</button>
            <button id="btn-video">Record Video</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

        // --- Config State ---
        const cfg = {
            eng: { text: "English", size: 80, col: '#ffd700', rough: 0.15, metal: 1.0, env: 1.5, kInt: 3.0, rInt: 8.0, lx: 80, ly: 50 },
            mal: { text: "കേരളം", size: 60, col: '#ffd700', rough: 0.3, metal: 1.0, kInt: 4.0, lx: -50 },
            glob: { gap: 40, thick: 1.2, anim: 'write', speed: 1.0 }
        };

        // --- DUAL SCENE SETUP ---
        const sceneEng = new THREE.Scene();
        const sceneMal = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(0, 0, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.autoClear = false; // CRITICAL FOR DUAL SCENE
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- ENVIRONMENT GENERATION (High Contrast Studio) ---
        // Instead of loading a file, we generate a high dynamic range texture for reflections
        function createStudioEnv() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // Background
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,512,256);
            // Soft Light
            const g = ctx.createLinearGradient(0,0,0,256);
            g.addColorStop(0, '#444'); g.addColorStop(1, '#000');
            ctx.fillStyle = g; ctx.fillRect(0,0,512,256);
            // Bright Strip (Rim Light Reflection)
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 100, 512, 20);
            ctx.fillStyle = '#888'; ctx.fillRect(0, 140, 512, 10);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.mapping = THREE.EquirectangularReflectionMapping;
            return tex;
        }
        const studioEnv = createStudioEnv();
        // Only apply to English Scene (Metal Wires)
        sceneEng.environment = studioEnv; 

        // --- LIGHTING RIGS (PHYSICALLY SEPARATE SCENES) ---
        
        // RIG 1: English Scene
        const eKey = new THREE.DirectionalLight(0xffffff, cfg.eng.kInt);
        eKey.position.set(cfg.eng.lx, cfg.eng.ly, 100);
        sceneEng.add(eKey);
        
        const eRim = new THREE.SpotLight(0xffffff, cfg.eng.rInt);
        eRim.position.set(-100, 50, -20); // Behind the text
        eRim.lookAt(0,0,0);
        sceneEng.add(eRim);

        // RIG 2: Malayalam Scene
        const mKey = new THREE.DirectionalLight(0xffffff, cfg.mal.kInt);
        mKey.position.set(cfg.mal.lx, 50, 200);
        sceneMal.add(mKey);
        
        const mAmb = new THREE.AmbientLight(0xffffff, 0.5); // Flat ambient for texture readability
        sceneMal.add(mAmb);

        // --- ASSETS ---
        const fontLoader = new FontLoader();
        let engFont = null;
        
        // --- MESH CONTAINERS ---
        const grpEng = new THREE.Group(); sceneEng.add(grpEng);
        const grpMal = new THREE.Group(); sceneMal.add(grpMal);

        const matEng = new THREE.MeshStandardMaterial({ 
            envMapIntensity: cfg.eng.env, 
            transparent: true, 
            opacity: 1.0,
            side: THREE.DoubleSide
        });
        
        const matMal = new THREE.MeshStandardMaterial({ 
            transparent: true, 
            side: THREE.DoubleSide 
        });

        // --- BUILDERS ---
        fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json', (f) => {
            engFont = f;
            refreshEng(1.0);
            refreshMal();
        });

        // BUILD ENGLISH (Geometry)
        function refreshEng(progress = 1.0) {
            if(!engFont) return;
            grpEng.clear();

            const shapes = engFont.generateShapes(cfg.eng.text, cfg.eng.size);
            const tubeGeos = [];
            
            shapes.forEach(shape => {
                const points = shape.getPoints();
                if(points.length < 2) return;
                points.push(points[0]); 
                
                const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p.x, p.y, 0)));
                const fullLen = Math.floor(points.length * 2); // Higher detail
                const drawCount = Math.max(2, Math.floor(fullLen * progress));
                
                if (drawCount > 2) {
                   const partial = curve.getPoints(fullLen).slice(0, drawCount);
                   if(partial.length>2) {
                       const c2 = new THREE.CatmullRomCurve3(partial);
                       tubeGeos.push(new THREE.TubeGeometry(c2, partial.length, cfg.glob.thick, 8, false));
                   }
                }

                // Holes
                if(progress > 0.3) {
                    const hProg = (progress - 0.3) * 1.43; // Map 0.3-1.0 to 0-1
                    if(hProg > 0) {
                        shape.holes.forEach(hole => {
                            const hPoints = hole.getPoints();
                            hPoints.push(hPoints[0]);
                            const hCurve = new THREE.CatmullRomCurve3(hPoints.map(p => new THREE.Vector3(p.x, p.y, 0)));
                            const hLen = Math.floor(hPoints.length * 2);
                            const hDraw = Math.max(2, Math.floor(hLen * Math.min(1, hProg)));
                            const hPart = hCurve.getPoints(hLen).slice(0, hDraw);
                            if(hPart.length > 2) {
                                const c3 = new THREE.CatmullRomCurve3(hPart);
                                tubeGeos.push(new THREE.TubeGeometry(c3, hPart.length, cfg.glob.thick, 8, false));
                            }
                        });
                    }
                }
            });

            if(tubeGeos.length > 0) {
                const geo = BufferGeometryUtils.mergeGeometries(tubeGeos);
                geo.center();
                
                matEng.color.set(cfg.eng.col);
                matEng.roughness = parseFloat(cfg.eng.rough);
                matEng.metalness = parseFloat(cfg.eng.metal);
                matEng.envMapIntensity = parseFloat(cfg.eng.env);

                const mesh = new THREE.Mesh(geo, matEng);
                // Pos
                const yPos = (cfg.glob.gap + cfg.eng.size/2 + cfg.mal.size/2) / 2;
                mesh.position.y = yPos;
                grpEng.add(mesh);
            }
        }

        // BUILD MALAYALAM (Texture)
        const cvs = document.createElement('canvas'); cvs.width = 4096; cvs.height = 1024;
        const ctx = cvs.getContext('2d');

        function refreshMal() {
            grpMal.clear();
            ctx.clearRect(0,0,4096,1024);
            const fs = cfg.mal.size * 4;
            ctx.font = `bold ${fs}px 'Gayathri', sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            // Thread Styling on Texture
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = cfg.glob.thick * 6;
            ctx.strokeText(cfg.mal.text, 2048, 512);

            const tex = new THREE.CanvasTexture(cvs);
            tex.minFilter = THREE.LinearFilter;
            
            matMal.map = null; matMal.alphaMap = tex;
            matMal.color.set(cfg.mal.col);
            matMal.roughness = parseFloat(cfg.mal.rough);
            matMal.metalness = parseFloat(cfg.mal.metal);
            matMal.alphaTest = 0.05;
            matMal.needsUpdate = true;

            const plane = new THREE.PlaneGeometry(409.6, 102.4);
            const mesh = new THREE.Mesh(plane, matMal);
            const yPos = -((cfg.glob.gap + cfg.eng.size/2 + cfg.mal.size/2) / 2);
            mesh.position.y = yPos;
            grpMal.add(mesh);
        }

        // --- UI BINDING ---
        const inputs = {
            engText: 'value', engSize: 'value', engColor: 'value', engRough: 'value', engMetal: 'value',
            engEnvInt: 'value', engKeyInt: 'value', engRimInt: 'value', engLightX: 'value', engLightY: 'value',
            malText: 'value', malSize: 'value', malColor: 'value', malRough: 'value', malMetal: 'value',
            malLightInt: 'value', malLightX: 'value',
            textGap: 'value', wireThick: 'value', animType: 'value', animSpeed: 'value'
        };

        function updateState() {
            for(const [id, prop] of Object.entries(inputs)) {
                const el = document.getElementById(id);
                if(el) {
                   if(id.startsWith('eng')) {
                       const key = id.replace('eng','').toLowerCase();
                       if(key === 'text') cfg.eng.text = el.value;
                       else if(key === 'size') cfg.eng.size = parseInt(el.value);
                       else if(key === 'color') cfg.eng.col = el.value;
                       else if(key === 'envint') cfg.eng.env = parseFloat(el.value);
                       else if(key === 'keyint') cfg.eng.kInt = parseFloat(el.value);
                       else if(key === 'rimint') cfg.eng.rInt = parseFloat(el.value);
                       else if(key === 'lightx') cfg.eng.lx = parseFloat(el.value);
                       else if(key === 'lighty') cfg.eng.ly = parseFloat(el.value);
                       else if(key === 'rough') cfg.eng.rough = parseFloat(el.value);
                       else if(key === 'metal') cfg.eng.metal = parseFloat(el.value);
                   }
                   else if(id.startsWith('mal')) {
                       const key = id.replace('mal','').toLowerCase();
                       if(key === 'text') cfg.mal.text = el.value;
                       else if(key === 'size') cfg.mal.size = parseInt(el.value);
                       else if(key === 'color') cfg.mal.col = el.value;
                       else if(key === 'lightint') cfg.mal.kInt = parseFloat(el.value);
                       else if(key === 'lightx') cfg.mal.lx = parseFloat(el.value);
                       else if(key === 'rough') cfg.mal.rough = parseFloat(el.value);
                       else if(key === 'metal') cfg.mal.metal = parseFloat(el.value);
                   }
                   else {
                       if(id === 'textGap') cfg.glob.gap = parseInt(el.value);
                       if(id === 'wireThick') cfg.glob.thick = parseFloat(el.value);
                       if(id === 'animType') cfg.glob.anim = el.value;
                       if(id === 'animSpeed') cfg.glob.speed = parseFloat(el.value);
                   }
                }
            }
            
            // Apply Lighting
            sceneEng.environmentIntensity = cfg.eng.env; // Setup env intensity
            eKey.intensity = cfg.eng.kInt; eKey.position.set(cfg.eng.lx, cfg.eng.ly, 100);
            eRim.intensity = cfg.eng.rInt;
            mKey.intensity = cfg.mal.kInt; mKey.position.x = cfg.mal.lx;
        }

        Object.keys(inputs).forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                updateState();
                if(id.includes('Size') || id.includes('Text') || id.includes('Thick') || id.includes('Gap')) {
                    refreshEng(1.0);
                    refreshMal();
                } else {
                    // Quick material updates
                    matEng.color.set(cfg.eng.col); matEng.roughness = cfg.eng.rough; matEng.metalness = cfg.eng.metal; matEng.envMapIntensity = cfg.eng.env;
                    matMal.color.set(cfg.mal.col); matMal.roughness = cfg.mal.rough; matMal.metalness = cfg.mal.metal;
                }
            });
        });

        // --- RENDER LOOP (DUAL SCENE) ---
        let isRecording = false;
        let animTime = 0;
        let recorder;

        function render() {
            // Animation Logic
            if(isRecording) {
                animTime += 0.005 * cfg.glob.speed;
                const type = cfg.glob.anim;
                
                if(type === 'write') {
                    const prog = Math.min(animTime * 3, 1.0);
                    refreshEng(prog); // Rebuild geom
                } else if(type === 'fade') {
                    matEng.opacity = Math.min(animTime * 2, 1);
                    matMal.opacity = Math.min(animTime * 2, 1);
                } else if(type === 'rotate') {
                    grpEng.rotation.y = animTime * 4;
                    grpMal.rotation.y = animTime * 4;
                } else if(type === 'float') {
                    grpEng.position.y = (cfg.glob.gap/2) + Math.sin(animTime*2)*10;
                }
            }

            // Dual Render
            renderer.clear();
            renderer.render(sceneEng, camera);
            renderer.clearDepth(); // IMPORTANT: Allows Mal to overlay correctly without Z-fighting or occlusion issues
            renderer.render(sceneMal, camera);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            render();
        }
        animate();

        // --- ACTIONS ---
        const btnRec = document.getElementById('btn-video');
        
        btnRec.addEventListener('click', () => {
            if(!isRecording) {
                isRecording = true; animTime = 0;
                
                // Init State
                if(cfg.glob.anim === 'write') refreshEng(0);
                if(cfg.glob.anim === 'fade') { matEng.opacity = 0; matMal.opacity = 0; }
                
                const stream = renderer.domElement.captureStream(30);
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const b = new Blob(chunks, {type:'video/webm'});
                    const u = URL.createObjectURL(b);
                    const a = document.createElement('a');
                    a.style.display='none'; a.href=u; a.download='anim.webm';
                    document.body.appendChild(a); a.click();
                    
                    // Reset
                    refreshEng(1.0); matEng.opacity=1; matMal.opacity=1;
                    grpEng.rotation.set(0,0,0); grpMal.rotation.set(0,0,0);
                };
                recorder.start();
                btnRec.innerText = "STOP RECORDING";
                btnRec.classList.add('recording');
            } else {
                isRecording = false;
                recorder.stop();
                btnRec.innerText = "RECORD VIDEO";
                btnRec.classList.remove('recording');
            }
        });

        document.getElementById('btn-png').addEventListener('click', () => {
            render();
            const a = document.createElement('a');
            a.download = 'hybrid-metal-v17.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click();
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
